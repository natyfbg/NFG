slug: standing-hamstring-stretch
name: Standing Hamstring Stretch
status: published
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [hamstrings]
  secondary: [calves]
equipment: []
summary: >-
  Propping one heel on a low step and hinging forward with a flat back. A hamstring
  stretch you can do anywhere, kept honest by the straight spine.
setup:
  - Place one heel on a low step or bench, leg straight, toes up.
  - Stand tall on the other leg with a soft knee.
steps:
  - Hinge forward from the hips with a flat back until you feel the back of the raised
    thigh.
  - Keep your hands on your hips or the raised thigh.
  - Hold for 30 seconds and switch.
cues:
  - Push the hips back rather than reaching down with the head.
  - Chest stays proud.
mistakes:
  - Rounding the back to touch the toes.
  - Locking the standing knee hard.
safety:
  - Use a lower step if you can't keep the back flat.
breathing: Breathe out as you hinge.
videos:
