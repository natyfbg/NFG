slug: pseudo-planche-lean
name: Pseudo Planche Lean
status: published
level: intermediate
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [front_delts]
  secondary: [abs, chest]
equipment: []
summary: >-
  Holding a plank with the hands by the hips and the shoulders leaning far forward.
  The starting point for planche strength and a brutal front-delt hold.
setup:
  - Take a plank with the hands beside the hips, fingers turned out.
  - Push the shoulder blades apart.
steps:
  - Lean the shoulders forward past the hands as far as you can hold.
  - Keep the body straight and the arms locked.
  - Hold for 10–30 seconds.
cues:
  - Push the floor away; round the upper back slightly.
  - Squeeze the glutes.
mistakes:
  - Letting the hips sag.
  - Bending the elbows.
safety:
  - Warm up the wrists. Reduce the lean if they ache.
breathing: Breathe steadily.
progressions: [pseudo-planche-push-up]
videos:
