slug: russian-twist
name: Russian Twist
status: published
level: beginner
category: strength
movement: core
mechanics: isolation
laterality: bilateral
muscles:
  primary: [obliques]
  secondary: [abs, hip_flexors]
equipment: []
summary: >-
  Sitting leaned back with the feet off the floor and rotating the torso side to side.
  Works the obliques; add weight when bodyweight is easy.
setup:
  - Sit with the knees bent, lean back to about 45 degrees and lift the feet (or keep
    the heels down for an easier version).
steps:
  - Rotate the torso to one side, bringing the hands toward the floor.
  - Rotate to the other side.
  - Keep alternating for 20–30 reps.
cues:
  - Rotate the shoulders, not just the arms.
  - Keep the back flat, not rounded.
mistakes:
  - Rounding the back.
  - Swinging the arms only.
safety:
  - Keep the heels on the floor if the lower back complains.
breathing: Breathe out on each twist.
videos:
  youtube: https://www.youtube.com/watch?v=jjyR6Z1U4dA
tags: [core, home, obliques]
notes: >-
  Hold a weight to progress
