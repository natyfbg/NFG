slug: behind-the-back-cable-lateral-raise
name: Behind-the-Back Cable Lateral Raise
status: published
level: intermediate
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [side_delts]
equipment: [cable]
summary: >-
  A cable lateral raise with the cable running behind the body. The angle loads the
  side delt from the very bottom of the rep.
setup:
  - Set the pulley low. Stand side-on, facing slightly away, and reach behind your back
    to grab the handle with the far hand.
steps:
  - Raise the arm out to the side to shoulder height, keeping the cable behind you.
  - Pause.
  - Lower slowly. Switch sides after the set.
cues:
  - Shoulder stays down and back.
  - Keep a slight elbow bend.
mistakes:
  - Twisting the torso.
  - Using momentum.
safety:
  - Light weight. Stop if the front of the shoulder pinches.
breathing: Breathe out as you raise.
videos:
  youtube: https://www.youtube.com/watch?v=pFACLhcjeps
tags: [cable, gym, raise, shoulders, unilateral]
notes: >-
  Cable runs behind your back
