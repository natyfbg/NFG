slug: low-cable-face-pull
name: Low Cable Face Pull
status: published
level: beginner
category: strength
movement: horizontal_pull
mechanics: compound
laterality: bilateral
muscles:
  primary: [rear_delts, upper_back]
  secondary: [traps]
equipment: [cable]
lists: [pull]
summary: >-
  A face pull with the pulley set low, pulling up and back. The upward angle hits the
  rear delts and lower traps.
setup:
  - Set the pulley low with a rope. Hold with palms in, step back, arms straight and
    angled down.
steps:
  - Pull the rope up and back toward the face, elbows high, hands pulling apart.
  - Squeeze the rear delts.
  - Return slowly.
cues:
  - Elbows above the hands at the finish.
  - Stand tall.
mistakes:
  - Leaning back.
  - Elbows dropping.
safety:
  - Light weight.
breathing: Breathe out as you pull.
videos:
  youtube: https://www.youtube.com/watch?v=6MBrtP8B5T4
tags: [back, cable, face-pull, gym]
notes: >-
  Your "low setup cable face pulls". Pulley set low
