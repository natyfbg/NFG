slug: inverted-row
name: Inverted Row
status: published
level: beginner
category: strength
movement: horizontal_pull
mechanics: compound
laterality: bilateral
muscles:
  primary: [upper_back, lats]
  secondary: [rear_delts, biceps, abs]
equipment: [suspension]
summary: >-
  A bodyweight row: lying back from suspension straps (or a bar set at hip height) and
  pulling your chest up. The more upright you stand, the easier it is.
setup:
  - Hold the straps (or a bar in a rack at about hip height) with palms facing in or down.
  - Walk your feet forward and lean back until your arms are straight.
  - Form a straight line from head to heels, heels on the floor.
steps:
  - Pull your shoulder blades back and together.
  - Row your chest up toward your hands, elbows close to your sides.
  - Pause briefly at the top with your chest near the handles.
  - Lower yourself back down to straight arms with control.
cues:
  - Keep your body rigid like a plank the whole time.
  - Lead with your chest, not your chin.
  - Walk your feet forward to make it harder, back to make it easier.
mistakes:
  - Letting the hips sag on the way up.
  - Shrugging the shoulders toward the ears.
  - Cutting the range short at the bottom.
safety:
  - Check the anchor point and strap length before you lean back.
breathing: Breathe out as you pull, in as you lower.
progressions: [pull-up]
videos:
