slug: downward-dog
name: Downward Dog
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [hamstrings, calves]
  secondary: [lats, front_delts]
equipment: []
summary: >-
  An inverted V with hands and feet on the floor. It stretches the hamstrings, calves
  and lats at once and teaches shoulder stability overhead.
setup:
  - Start on hands and knees, hands a little in front of your shoulders.
  - Tuck your toes.
steps:
  - Lift your hips up and back so your body forms an inverted V.
  - Press the floor away with your hands and reach your chest toward your thighs.
  - Pedal the heels toward the floor, then hold for 30–45 seconds.
cues:
  - Long spine first; bend the knees as much as you need to keep it.
  - Push the floor away so the shoulders aren't crushed.
mistakes:
  - Rounding the back to get the heels down.
  - Letting the head hang heavily.
safety:
  - Keep the knees soft if your hamstrings are tight. Skip it if you have wrist pain.
breathing: Slow breaths; lengthen the spine on each breath in.
videos:
