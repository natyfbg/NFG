slug: shuttle-run
name: Shuttle Run
status: draft
level: intermediate
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [quads, glutes, calves]
  secondary: [hamstrings]
equipment: []
summary: >-
  Sprinting between two markers and touching the line each time. Builds speed and the
  ability to stop, turn and go again.
setup:
  - Set two markers 10–20 metres apart. Warm up well first.
steps:
  - Sprint to the far line, touch it, turn and sprint back.
  - Do 4–8 lengths per set, then rest 60–90 seconds.
  - Repeat for 4–6 sets.
cues:
  - Get low and plant the outside foot to turn.
  - Accelerate hard out of each turn.
mistakes:
  - Slowing down early before the line.
  - Turning with a tall, upright body.
safety:
  - Only on a non-slip surface. Build up the number of sets over weeks.
breathing: Breathe hard during the set, recover fully between.
videos:
  youtube: https://www.youtube.com/watch?v=3-iZMS6twcE
tags: [cardio, conditioning, home, intervals, running]
notes: >-
  Sprint between two marks. Agility
