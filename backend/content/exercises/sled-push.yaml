slug: sled-push
name: Sled Push
status: draft
level: intermediate
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [quads, glutes, calves]
  secondary: [front_delts]
equipment: [machine]
summary: >-
  Driving a loaded sled across the floor. All the leg and lung work of sprinting with
  almost no impact and no eccentric soreness.
setup:
  - Load the sled. Grab the high or low handles with straight arms and lean in at about
    45 degrees.
steps:
  - Drive the legs, pushing through the balls of the feet, taking short powerful steps.
  - Push for 15–30 metres, then rest 60–90 seconds.
  - Do 4–8 pushes.
cues:
  - Lean from the ankles with a straight line from heel to head.
  - Short steps, big push.
mistakes:
  - Standing too upright.
  - Letting the hips rise above the shoulders.
safety:
  - Choose a load you can keep moving at a steady pace; stalling is harder on the back.
breathing: Breathe steadily; don't hold your breath on each step.
videos:
  youtube: https://www.youtube.com/watch?v=1PmO6kzBEc8
tags: [cardio, conditioning, gym, intervals, legs]
notes: >-
  Sled pull covered in the how-to
