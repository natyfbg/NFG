slug: prone-y-raise
name: Prone Y Raise
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [traps, rear_delts]
  secondary: [side_delts, upper_back]
equipment: []
summary: >-
  Lying face down and raising straight arms into a Y shape, thumbs up. Trains the
  lower traps and rear delts, the muscles that keep the shoulders healthy.
setup:
  - Lie face down on the floor or a bench, arms extended overhead at about 45 degrees,
    thumbs up.
steps:
  - Raise the arms as high as you can without lifting the chest.
  - Squeeze between the shoulder blades.
  - Lower slowly.
cues:
  - Thumbs point to the ceiling.
  - Keep the neck long; don't look up.
mistakes:
  - Shrugging the shoulders.
  - Arching the back to lift higher.
safety:
  - Bodyweight or very light plates only.
breathing: Breathe out as you raise.
videos:
  youtube: https://www.youtube.com/watch?v=DQFTp5n0uh0
tags: [bodyweight, home, raise, shoulders]
notes: >-
  Your "prone y axis". Lying on your chest, arms overhead in a Y, thumbs up
