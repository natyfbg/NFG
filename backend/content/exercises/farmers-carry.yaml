slug: farmers-carry
name: Farmer's Carry
status: published
level: beginner
category: strength
movement: carry
mechanics: compound
laterality: bilateral
muscles:
  primary: [forearms, traps]
  secondary: [abs, obliques]
equipment: [dumbbell]
summary: >-
  Walking while holding heavy weights at your sides. It builds grip, upper back and
  core strength in a way that carries straight over to everyday life.
setup:
  - Stand between two heavy dumbbells or kettlebells.
  - Squat down with a flat back and grab them firmly.
  - Stand up tall with the weights at your sides.
steps:
  - Walk forward with short, steady steps.
  - Keep your shoulders down and back and your chest up.
  - Walk for a set distance or time.
  - Put the weights down with a flat back, the same way you picked them up.
cues:
  - Squeeze the handles as hard as you can.
  - Stay tall; don't lean to either side.
  - Brace your core like you're about to be pushed.
mistakes:
  - Rounding the back to pick up or set down the weights.
  - Shrugging the shoulders up.
  - Taking long, bouncing strides.
safety:
  - Clear your walking path first, and set the weights down before your grip gives out.
breathing: Breathe steadily while keeping your core braced.
videos:
