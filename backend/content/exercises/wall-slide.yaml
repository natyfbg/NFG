slug: wall-slide
name: Wall Slide
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [traps]
  secondary: [front_delts, upper_back]
equipment: []
summary: >-
  Sliding the forearms up a wall from a goalpost position. Teaches the shoulder blades
  to rotate upward for pain-free overhead work.
setup:
  - Stand with your back against a wall, feet a little forward.
  - Place the backs of the arms against the wall in a goalpost shape, elbows at shoulder
    height.
steps:
  - Slide the arms up the wall as high as you can while keeping the forearms and wrists
    in contact.
  - Pause at the top.
  - Slide back down. Do 8–12 slow reps.
cues:
  - Ribs down; don't arch away from the wall.
  - Keep the wrists on the wall.
mistakes:
  - Arching the back as the arms rise.
  - Shrugging.
safety:
  - Only go as high as the arms stay on the wall.
breathing: Breathe out as you slide up.
videos:
  youtube: https://www.youtube.com/watch?v=9ZBOvVO9JFs
tags: [home, mobility, shoulders, warm-up]
notes: >-
  Your "wall arm slides", and "wall angels" on the mobility list. Mobility and warm-up
