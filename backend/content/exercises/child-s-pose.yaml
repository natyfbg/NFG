slug: child-s-pose
name: Child's Pose
status: published
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [lats, lower_back]
equipment: []
summary: >-
  Kneeling and folding forward with the arms stretched out in front. It lengthens the
  lats and lower back and is the easiest way to settle your breathing after a session.
setup:
  - Kneel with big toes together and knees apart.
  - Sit back toward your heels and walk your hands forward.
steps:
  - Rest your forehead on the floor and let your chest sink between your thighs.
  - Reach the fingertips further forward to feel the stretch through the lats.
  - Hold for 30–60 seconds; walk the hands to one side to stretch each lat more.
cues:
  - Hips keep sinking back toward the heels.
  - Let the shoulders relax away from the ears.
mistakes:
  - Hips lifting up as you reach forward.
  - Holding your breath.
safety:
  - Put a cushion between calves and thighs if your knees don't like the fold.
breathing: Long, slow breaths into the back of the ribs.
videos:
