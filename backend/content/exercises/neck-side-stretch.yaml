slug: neck-side-stretch
name: Neck Side Stretch
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [traps]
equipment: []
summary: >-
  Tilting the ear toward the shoulder with a gentle hand assist. Relieves the upper
  traps and neck after heavy carries, shrugs or a long day at a desk.
setup:
  - Sit or stand tall with shoulders relaxed.
  - Hold the seat or put the opposite hand behind your back to anchor that shoulder.
steps:
  - Tilt your ear toward one shoulder.
  - Rest the same-side hand lightly on your head for a little extra weight.
  - Hold for 20–30 seconds and switch sides.
cues:
  - Opposite shoulder stays down; that's where the stretch comes from.
  - Face forward, don't rotate.
mistakes:
  - Pulling hard on the head.
  - Lifting the opposite shoulder.
safety:
  - Let the hand's weight do the work; never yank the neck.
breathing: Slow breaths; relax the shoulder down on each breath out.
videos:
