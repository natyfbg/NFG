slug: high-knees
name: High Knees
status: published
level: beginner
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [hip_flexors, quads]
  secondary: [calves]
equipment: []
summary: >-
  Running on the spot while driving the knees up to hip height. A fast warm-up for the
  hip flexors, calves and heart.
setup:
  - Stand tall with feet hip-width apart.
steps:
  - Drive one knee up to hip height, then the other, as if sprinting on the spot.
  - Pump the arms in opposition to the legs.
  - Go for 20–40 seconds.
cues:
  - Stay tall; chest up.
  - Land lightly on the balls of the feet.
mistakes:
  - Leaning back to get the knees higher.
  - Slow, heavy steps.
safety:
  - March the knees up instead of running if you want it low-impact.
breathing: Quick, rhythmic breaths.
videos:
  youtube: https://www.youtube.com/watch?v=4UI6gqphvNc
tags: [cardio, conditioning, home, warm-up]
notes: >-
  Covers fast feet too
