slug: straight-arm-lat-pushdown
name: Straight-Arm Lat Pushdown
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [lats]
  secondary: [triceps]
equipment: [cable]
lists: [pull]
summary: >-
  Pushing a bar or rope down to the thighs with straight arms. Isolates the lats and
  teaches you to feel them before rows and pulldowns.
setup:
  - Set the pulley high with a straight bar or rope. Stand back, hinge slightly, arms
    straight in front at shoulder height.
steps:
  - Push the bar down in an arc to the thighs, keeping the arms straight.
  - Squeeze the lats at the bottom.
  - Return slowly to shoulder height.
cues:
  - Soft elbows, held still.
  - Keep the chest up; don't round.
mistakes:
  - Bending the elbows, making it a pushdown.
  - Using the torso to heave.
safety:
  - Light weight.
breathing: Breathe out as you push down.
videos:
  youtube: https://www.youtube.com/watch?v=DK1h4pp6zuc
tags: [back, cable, gym, lats]
notes: >-
  Aka straight-arm pulldown
