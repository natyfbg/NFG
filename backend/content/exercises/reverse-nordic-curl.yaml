slug: reverse-nordic-curl
name: Reverse Nordic Curl
status: published
level: intermediate
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [quads]
equipment: []
lists: [lower]
summary: >-
  Kneeling and leaning back with straight hips, then pulling back up. A bodyweight
  quad stretch and strength move in one.
setup:
  - Kneel on a pad with the hips extended and the body straight from knees to head.
steps:
  - Lean back slowly, keeping the hips straight, as far as the quads allow.
  - Pause.
  - Pull back up to vertical using the quads.
cues:
  - Squeeze the glutes; don't bend at the hips.
  - Small range to start.
mistakes:
  - Hinging at the hips.
  - Going too far too soon.
safety:
  - Build range over weeks. Skip it if your knees hurt.
breathing: Breathe in as you lean back, out as you return.
videos:
  youtube: https://www.youtube.com/watch?v=XHCz7nkfap4
tags: [bodyweight, home, quads]
notes: >-
  Your "reverse nordic". Kneeling, lean back with straight hips
