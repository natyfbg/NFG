slug: battle-rope-waves
name: Battle Rope Waves
status: draft
level: beginner
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [front_delts, forearms]
  secondary: [abs, biceps]
equipment: [machine]
summary: >-
  Whipping two heavy ropes into waves from a half-squat. It spikes the heart rate
  while hammering the shoulders, arms and core.
setup:
  - Anchor the ropes and hold one end in each hand.
  - Stand with feet shoulder-width apart, knees bent, chest up, core braced.
steps:
  - Snap the arms up and down alternately to send waves down the ropes.
  - Keep the waves even and continuous for 20–30 seconds.
  - Rest 30–60 seconds and repeat; try double waves (both arms together) for a change.
cues:
  - Stay low; the legs hold the position while the arms work.
  - Small, fast arm movement, not big swings.
mistakes:
  - Standing up tall and losing the squat.
  - Letting the waves die before the interval ends.
safety:
  - Keep the back flat in the half-squat. Shorten the intervals if form breaks.
breathing: Short, rhythmic breaths.
