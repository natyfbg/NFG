slug: ez-bar-preacher-curl
name: EZ-Bar Preacher Curl
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [biceps]
equipment: [barbell, bench]
lists: [pull]
summary: >-
  Curling the EZ bar with the upper arms resting on a preacher bench. The bench kills
  momentum and gives the biceps a hard stretch at the bottom.
setup:
  - Set the preacher pad so the armpits rest on top. Hold the EZ bar on the inner or
    outer grips with the upper arms flat on the pad.
steps:
  - Curl the bar up until the forearms are vertical.
  - Squeeze.
  - Lower slowly until the arms are nearly straight.
cues:
  - Upper arms glued to the pad.
  - Control the bottom; don't drop into the stretch.
mistakes:
  - Lifting the elbows off the pad.
  - Fully locking the elbows at the bottom under heavy load.
safety:
  - Stop just short of straight arms with heavy weights.
breathing: Breathe out as you curl.
videos:
  youtube: https://www.youtube.com/watch?v=PIRJogU2-dw
tags: [barbell, biceps, curl, gym]
notes: >-
  Dumbbell and close-grip versions covered in the how-to
