slug: flutter-kicks
name: Flutter Kicks
status: draft
level: beginner
category: strength
movement: core
mechanics: isolation
laterality: bilateral
muscles:
  primary: [abs]
  secondary: [hip_flexors]
equipment: []
summary: >-
  Lying on your back and kicking the straight legs up and down a few inches off the
  floor. Burns the lower abs and hip flexors.
setup:
  - Lie on your back with the hands under the hips, legs straight, heels a few inches
    off the floor.
steps:
  - Kick the legs up and down in small, quick movements.
  - Keep the lower back pressed into the floor.
  - Go for 20–40 seconds.
cues:
  - Small kicks.
  - Back flat; raise the legs higher if it arches.
mistakes:
  - Arching the lower back.
  - Bending the knees.
safety:
  - Keep the legs higher to make it easier on the back.
breathing: Breathe steadily.
videos:
