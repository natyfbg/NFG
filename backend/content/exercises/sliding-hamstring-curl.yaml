slug: sliding-hamstring-curl
name: Sliding Hamstring Curl
status: draft
level: intermediate
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [hamstrings]
  secondary: [glutes, abs]
equipment: []
summary: >-
  Lying on your back with the heels on sliders and dragging them toward you while
  bridging. A nordic-lite for home that hits the hamstrings and glutes.
setup:
  - Lie on your back with the heels on sliders, towels or socks on a smooth floor, legs
    straight.
  - Lift the hips into a bridge.
steps:
  - Drag the heels toward the glutes while keeping the hips up.
  - Pause with the knees bent.
  - Slide the heels back out under control, hips still lifted.
cues:
  - Hips stay up the whole set.
  - Slow on the way out.
mistakes:
  - Dropping the hips.
  - Sliding out too fast.
safety:
  - Keep the range short at first; the hamstrings cramp easily here.
breathing: Breathe out as you drag the heels in.
regressions: [glute-bridge]
progressions: [nordic-hamstring-curl]
videos:
  youtube: https://www.youtube.com/watch?v=HAQpsaX3s2o
tags: [bodyweight, hamstrings, home]
notes: >-
  Heels on a towel on a smooth floor, hips up
