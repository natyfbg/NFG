slug: knee-to-wall-ankle-mobilization
name: Knee-to-Wall Ankle Mobilization
status: published
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [calves]
equipment: []
summary: >-
  Driving the knee toward a wall with the heel down. It improves ankle range, which is
  what lets you squat deeper with your heels flat.
setup:
  - Face a wall with one foot a hand's width away, toes pointing at it.
  - The other foot stays back for balance.
steps:
  - Drive the front knee forward toward the wall, keeping the heel flat.
  - Touch the wall if you can, then return. Move the foot back a little when it gets
    easy.
  - Do 10–15 slow reps per side.
cues:
  - Knee tracks over the second toe.
  - Heel glued to the floor.
mistakes:
  - Letting the heel lift.
  - Knee collapsing inward.
safety:
  - Stop at the point where the heel wants to lift; the range grows over weeks.
breathing: Breathe out as the knee moves forward.
videos:
  youtube: https://www.youtube.com/watch?v=Y1IZXkdPPdw
tags: [ankles, calves, home, mobility, warm-up]
notes: >-
  Helps squat depth
