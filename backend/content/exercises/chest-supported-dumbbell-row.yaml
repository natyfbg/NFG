slug: chest-supported-dumbbell-row
name: Chest-Supported Dumbbell Row
status: published
level: beginner
category: strength
movement: horizontal_pull
mechanics: compound
laterality: bilateral
muscles:
  primary: [upper_back, lats]
  secondary: [rear_delts, biceps]
equipment: [dumbbell, bench]
summary: >-
  A row lying face-down on an incline bench. With your chest supported, your lower
  back is out of the picture and your upper back does all the work.
setup:
  - Set an adjustable bench to about 30–45°.
  - Lie face-down with your chest on the pad and your toes on the floor.
  - Let the dumbbells hang straight down below your shoulders, palms facing in.
steps:
  - Pull your shoulder blades back, then row the dumbbells up toward your lower ribs.
  - Squeeze your upper back at the top for a moment.
  - Lower the dumbbells slowly until your arms are straight.
  - Let your shoulder blades spread apart at the bottom before the next rep.
cues:
  - Keep your chest glued to the pad.
  - Elbows travel back, not out.
  - Chin tucked, neck long.
mistakes:
  - Lifting the chest off the pad to finish reps.
  - Shrugging the shoulders up instead of squeezing back.
  - Rushing the lowering phase.
safety:
  - Make sure the bench is locked at its angle and stable before lying on it.
breathing: Breathe out as you row, in as you lower.
progressions: [barbell-row]
