slug: prone-t-raise
name: Prone T Raise
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [rear_delts, upper_back]
  secondary: [traps]
equipment: []
summary: >-
  Lying face down and raising straight arms out to the sides into a T. Hits the rear
  delts and mid-back with almost no load.
setup:
  - Lie face down with the arms out to the sides at shoulder height, thumbs up.
steps:
  - Raise the arms toward the ceiling, squeezing the shoulder blades together.
  - Pause at the top.
  - Lower slowly.
cues:
  - Thumbs up, elbows nearly straight.
  - Forehead stays down.
mistakes:
  - Shrugging.
  - Lifting the chest.
safety:
  - Use light dumbbells only once bodyweight is easy.
breathing: Breathe out as you raise.
videos:
  youtube: https://www.youtube.com/watch?v=UlnPZC6Ly-Q
tags: [bodyweight, home, raise, shoulders]
notes: >-
  Arms straight out to the sides
