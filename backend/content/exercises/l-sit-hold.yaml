slug: l-sit-hold
name: L-Sit Hold
status: draft
level: advanced
category: strength
movement: core
mechanics: compound
laterality: bilateral
muscles:
  primary: [abs, hip_flexors]
  secondary: [triceps, front_delts]
equipment: []
summary: >-
  Holding the body up on the hands with the legs straight out in front. Core, hip
  flexors and triceps all working at once.
setup:
  - Sit on the floor or between parallettes with the hands beside the hips.
steps:
  - Press into the hands, lift the hips and extend the legs straight in front.
  - Hold for 5–20 seconds.
  - Lower and rest.
cues:
  - Push the floor away; shoulders down.
  - Squeeze the quads to keep the legs straight.
mistakes:
  - Bending the knees.
  - Shrugging the shoulders.
safety:
  - Start with a tucked-knee hold and extend one leg at a time.
breathing: Breathe steadily.
videos:
  youtube: https://www.youtube.com/watch?v=ZZx_06F2iKs
tags: [bodyweight, core, hold, home]
notes: >-
  On the floor, two chairs or parallettes
