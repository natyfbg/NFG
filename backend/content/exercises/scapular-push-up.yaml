slug: scapular-push-up
name: Scapular Push-Up
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [front_delts]
  secondary: [chest, abs]
equipment: []
summary: >-
  Pushing the shoulder blades apart and letting them come together from a plank, with
  straight arms. Trains the serratus, the muscle that keeps the shoulder blades flat.
setup:
  - Take a plank position with straight arms, hands under the shoulders.
steps:
  - Keeping the arms straight, let the chest sink as the shoulder blades squeeze
    together.
  - Push the floor away so the shoulder blades spread apart and the upper back rounds
    slightly.
  - Repeat for 10–15 slow reps.
cues:
  - Elbows stay locked; only the shoulder blades move.
  - Keep the hips still.
mistakes:
  - Bending the elbows.
  - Piking the hips.
safety:
  - Do it from the knees if the plank is tiring.
breathing: Breathe out as you push away.
videos:
  youtube: https://www.youtube.com/watch?v=N6jNuXZJn9s
tags: [bodyweight, home, shoulders, warm-up]
notes: >-
  Mainly trains the serratus (side of the ribs), which has no app tag
