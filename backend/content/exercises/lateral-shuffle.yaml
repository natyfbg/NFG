slug: lateral-shuffle
name: Lateral Shuffle
status: draft
level: beginner
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [quads, glutes, abductors]
  secondary: [calves]
equipment: []
summary: >-
  Quick side-to-side shuffles from an athletic stance. Warms up the hips and glutes
  sideways, which most training ignores.
setup:
  - Stand in a half-squat with feet wider than the hips, chest up, weight on the balls
    of the feet.
steps:
  - Shuffle sideways for 5–10 metres, pushing off the trailing foot.
  - Stay low the whole way; don't let the feet cross.
  - Shuffle back the other way. Repeat for 20–40 seconds.
cues:
  - Push off the outside foot.
  - Hips stay at the same height throughout.
mistakes:
  - Standing up tall between steps.
  - Crossing the feet.
safety:
  - Keep the steps short and controlled on slippery floors.
breathing: Rhythmic breathing.
videos:
