slug: freestanding-handstand-push-up
name: Freestanding Handstand Push-Up
status: draft
level: advanced
category: strength
movement: vertical_push
mechanics: compound
laterality: bilateral
muscles:
  primary: [front_delts]
  secondary: [triceps, side_delts, traps]
equipment: []
summary: >-
  A handstand push-up without the wall. Balance and pressing strength at the same
  time; one of the hardest moves in the library.
setup:
  - Kick up to a freestanding handstand you can hold for 20 seconds.
steps:
  - Lower slowly by bending the elbows, keeping the balance with the fingertips.
  - Touch the head lightly to the floor or a pad.
  - Press back to straight arms.
cues:
  - Keep the body tight through the whole rep.
  - Elbows forward, not out.
mistakes:
  - Losing balance by letting the hips fall behind.
  - Dropping fast.
safety:
  - Only after wall handstand push-ups and freestanding holds are solid.
breathing: Breathe in down, out up.
regressions: [wall-handstand-push-up, freestanding-handstand]
