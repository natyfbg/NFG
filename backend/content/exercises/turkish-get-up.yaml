slug: turkish-get-up
name: Turkish Get-Up
status: published
level: intermediate
category: strength
movement: full_body
mechanics: compound
laterality: bilateral
muscles:
  primary: [obliques, front_delts, glutes]
  secondary: [abs, triceps, quads]
equipment: [kettlebell]
summary: >-
  Standing up from lying down while holding a kettlebell overhead, then reversing it.
  Every muscle works, especially the shoulders and core.
setup:
  - Lie on your back with a kettlebell pressed up in one hand, the same-side knee bent
    and the opposite arm and leg out at 45 degrees.
steps:
  - Roll up onto the opposite elbow, then the hand, keeping the kettlebell overhead.
  - Lift the hips, sweep the straight leg back to a kneeling position.
  - Stand up. Reverse every step to return to the floor.
cues:
  - Eyes on the kettlebell the whole time.
  - Arm locked straight overhead.
mistakes:
  - Rushing any step.
  - Letting the elbow bend.
safety:
  - Learn it with no weight, then a shoe on the fist, before using a kettlebell.
breathing: Breathe steadily; exhale on each transition.
videos:
  youtube: https://www.youtube.com/watch?v=5aEOAPJQ4w0
tags: [full-body, hybrid, kettlebell]
notes: >-
  Full-body move that also builds shoulder stability
