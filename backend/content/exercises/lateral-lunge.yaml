slug: lateral-lunge
name: Lateral Lunge
status: published
level: beginner
category: strength
movement: lunge
mechanics: compound
laterality: unilateral
muscles:
  primary: [adductors, glutes, quads]
  secondary: [hamstrings]
equipment: []
summary: >-
  Stepping out to the side and sitting into one hip. It trains the legs side to side
  and works the inner thighs that forward lunges miss.
setup:
  - Stand tall with your feet together and hands clasped at your chest.
steps:
  - Take a wide step to one side.
  - Bend that knee and sit your hips back, keeping the other leg straight.
  - Lower until you feel a stretch in the inner thigh of the straight leg.
  - Push off the bent leg to return to standing.
cues:
  - Sit back into the hip, like closing a car door with your bottom.
  - Both feet point forward and stay flat.
  - Chest up.
mistakes:
  - Bending the knee without sitting the hips back.
  - Lifting the heel of the bent leg.
  - Rounding the back to get lower.
safety:
  - Only step as wide and sit as deep as feels comfortable for your inner thighs.
breathing: Breathe in as you step and lower, out as you push back.
tags: [lunge, legs, adductors, bodyweight]
