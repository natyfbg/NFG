slug: fingers-forward-pseudo-planche-push-up
name: Fingers-Forward Pseudo Planche Push-Up
status: published
level: advanced
category: strength
movement: horizontal_push
mechanics: compound
laterality: bilateral
muscles:
  primary: [front_delts, chest]
  secondary: [triceps, abs]
equipment: []
lists: [full_push, chest_focus, shoulder_focus]
summary: >-
  The pseudo planche push-up with the fingers pointing forward. The grip demands more
  from the wrists and biceps, so it's the harder version.
setup:
  - Hands beside the hips, fingers pointing forward.
  - Lean the shoulders well past the hands and brace the whole body.
steps:
  - Lower your chest toward the floor, holding the forward lean.
  - Pause low.
  - Press back up, keeping the shoulder blades pushed apart.
cues:
  - Spread the fingers and grip the floor.
  - Keep the lean constant from first rep to last.
mistakes:
  - Wrists collapsing as fatigue builds.
  - Reducing the lean to make it easier.
safety:
  - Only after the fingers-out version is strong. Stop if the wrists ache.
breathing: Breathe in down, out up.
regressions: [pseudo-planche-push-up]
