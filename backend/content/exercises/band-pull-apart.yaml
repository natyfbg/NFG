slug: band-pull-apart
name: Band Pull-Apart
status: published
level: beginner
category: strength
movement: horizontal_pull
mechanics: isolation
laterality: bilateral
muscles:
  primary: [rear_delts, upper_back]
  secondary: [traps]
equipment: [bands]
summary: >-
  Stretching a resistance band apart in front of your chest. A simple, joint-friendly
  way to train the rear shoulders and upper back, and a good warm-up for pressing days.
setup:
  - Stand tall holding a light band in front of you at shoulder height.
  - Hands about shoulder-width apart, palms facing down, arms straight.
steps:
  - Pull the band apart by moving your hands out to the sides.
  - Squeeze your shoulder blades together when the band touches your chest.
  - Return slowly to the start, keeping tension on the band.
cues:
  - Keep your arms nearly straight, with a soft bend in the elbows.
  - Shoulders down and away from your ears.
  - Ribs down — don't arch your lower back to finish the rep.
mistakes:
  - Using a band so heavy you have to bend your elbows a lot.
  - Shrugging as you pull.
  - Letting the band snap back.
safety:
  - Check the band for nicks or tears before using it; a snapping band can hit your face.
breathing: Breathe out as you pull apart, in as you return.
tags: [pull, rear-delts, upper-back, bands, warm-up]
