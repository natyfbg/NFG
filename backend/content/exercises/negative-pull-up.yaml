slug: negative-pull-up
name: Negative Pull-Up
status: published
level: beginner
category: strength
movement: vertical_pull
mechanics: compound
laterality: bilateral
muscles:
  primary: [lats]
  secondary: [biceps, upper_back, forearms]
equipment: [pullup_bar]
summary: >-
  Jumping or stepping to the top of a pull-up and lowering as slowly as you can. The
  fastest route to a first pull-up.
setup:
  - Stand on a box under the bar so you can start with the chin over it. Grip slightly
    wider than the shoulders.
steps:
  - Step off the box and hold the top position for a second.
  - Lower yourself as slowly as possible, aiming for 3–5 seconds, all the way to
    straight arms.
  - Step back on the box and repeat for 3–6 reps.
cues:
  - Fight the whole way down; don't drop the last part.
  - Shoulders down, chest up.
mistakes:
  - Dropping quickly through the middle.
  - Kicking the legs.
safety:
  - Finish with the arms fully straight but the shoulders active, not hanging loose.
breathing: Breathe out slowly as you lower.
progressions: [partial-pull-up, pull-up]
videos:
  youtube: https://www.youtube.com/watch?v=gbPURTSxQLY
tags: [back, home, pull-up]
notes: >-
  Slow lowering only. The main step toward a first pull-up
