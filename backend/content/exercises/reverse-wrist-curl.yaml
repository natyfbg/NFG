slug: reverse-wrist-curl
name: Reverse Wrist Curl
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [forearms]
equipment: [dumbbell, bench]
summary: >-
  Lifting the backs of the hands with the forearms resting on a bench, palms down.
  Trains the wrist extensors that balance out gripping work.
setup:
  - Kneel beside a bench with the forearms on it, palms down and the hands hanging off
    the edge, holding light dumbbells.
steps:
  - Lift the backs of the hands up as high as they go.
  - Pause.
  - Lower slowly.
cues:
  - Forearms stay flat on the bench.
  - Small, controlled movement.
mistakes:
  - Lifting the forearms off.
  - Going heavy.
safety:
  - Very light weight, higher reps.
breathing: Breathe out as you lift.
videos:
  youtube: https://www.youtube.com/watch?v=krZ6pWGZ8xo
tags: [forearms, hybrid]
notes: >-
  Palms down. Barbell and one-arm versions covered in the how-to
