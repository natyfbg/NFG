slug: standing-quad-stretch
name: Standing Quad Stretch
status: published
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [quads]
  secondary: [hip_flexors]
equipment: []
summary: >-
  Holding one foot behind you and keeping the knees together. Stretches the quads and
  hip flexors after squats, lunges or running.
setup:
  - Stand tall; hold a wall if you need balance.
  - Bend one knee and hold the top of that foot behind you.
steps:
  - Pull the heel toward your glute while keeping the knees side by side.
  - Tuck the tailbone and squeeze the glute of the stretched leg.
  - Hold for 30 seconds and switch.
cues:
  - Knees together, not drifting apart.
  - Hips forward, not arched.
mistakes:
  - Arching the lower back to get the heel closer.
  - Letting the bent knee swing out to the side.
safety:
  - Hold the foot, not the toes, and stop if the knee complains.
breathing: Breathe normally.
videos:
  youtube: https://www.youtube.com/watch?v=Jb6JEEUGbDY
tags: [home, mobility, quads, stretching]
notes: >-
  Side-lying version covered in the how-to
