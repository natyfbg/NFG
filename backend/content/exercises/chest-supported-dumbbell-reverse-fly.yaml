slug: chest-supported-dumbbell-reverse-fly
name: Chest-Supported Dumbbell Reverse Fly
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [rear_delts]
  secondary: [upper_back]
equipment: [dumbbell, bench]
lists: [full_push, shoulder_focus]
summary: >-
  Reverse flys lying face down on an incline bench. The bench takes the lower back out
  of it, so the rear delts do everything.
setup:
  - Set a bench to about 30–45 degrees and lie chest-down on it holding light dumbbells,
    arms hanging.
steps:
  - Raise the arms out to the sides with a slight bend in the elbows until they're level
    with the shoulders.
  - Squeeze the rear delts.
  - Lower slowly.
cues:
  - Lead with the elbows.
  - Chin off the bench, neck neutral.
mistakes:
  - Shrugging.
  - Bending the elbows more to lift heavier.
safety:
  - Light weight.
breathing: Breathe out as you raise.
videos:
  youtube: https://www.youtube.com/watch?v=7pE90Lysxss
tags: [fly, hybrid, shoulders]
notes: >-
  Your "incline bench supported dumbbell reverse fly" / "chest supported dumbbell
  flys"
