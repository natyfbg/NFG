slug: cable-internal-rotation
name: Cable Internal Rotation
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [rotator_cuff]
equipment: [cable]
summary: >-
  Rotating the forearm inward against a cable, elbow at the side. The partner to
  external rotation, for a balanced rotator cuff.
setup:
  - Set the pulley at elbow height. Stand side-on with the near arm's elbow at your
    side, bent 90 degrees, forearm pointing toward the machine.
steps:
  - Rotate the forearm inward across the body, keeping the elbow still.
  - Pause.
  - Return slowly. Switch sides after the set.
cues:
  - Elbow pinned.
  - Keep the shoulder down.
mistakes:
  - Leaning away from the machine.
  - Rushing the return.
safety:
  - Light weight.
breathing: Breathe out as you rotate in.
videos:
  youtube: https://www.youtube.com/watch?v=0TxfJCE8yqU
tags: [cable, gym, rotator-cuff, shoulders]
notes: >-
  Rotator cuff, as above
