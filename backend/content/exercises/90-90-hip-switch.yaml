slug: 90-90-hip-switch
name: 90/90 Hip Switch
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [glutes]
  secondary: [adductors]
equipment: []
summary: >-
  Sitting with both knees bent at 90 degrees and rotating them from one side to the
  other. It opens the hips in both directions at once and is one of the best warm-ups
  before squats or lunges.
setup:
  - Sit on the floor with your front leg bent 90 degrees in front of you and your back
    leg bent 90 degrees out to the side.
  - Sit tall; use your hands behind you for balance if you need to.
steps:
  - Lift both knees a few inches and rotate them together to the other side.
  - Settle into the new position with the opposite leg in front.
  - Pause for a breath, then switch back.
cues:
  - Chest stays up; don't collapse over the front leg.
  - Move slowly enough to feel the hip rotating, not the back.
mistakes:
  - Rounding the lower back to get the knees down.
  - Rushing through the switch without pausing.
safety:
  - Keep the range where your hips move freely. Pinching at the front of the hip means
    you're forcing it.
breathing: Breathe out as you switch sides.
videos:
  youtube: https://www.youtube.com/watch?v=HUZimFZJZWU
tags: [hips, home, mobility, stretching, warm-up]
notes: >-
  Hip rotation. Covers the static 90/90 hold
