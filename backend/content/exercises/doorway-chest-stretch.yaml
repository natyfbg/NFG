slug: doorway-chest-stretch
name: Doorway Chest Stretch
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [chest]
  secondary: [front_delts]
equipment: []
summary: >-
  Placing the forearms on a door frame and leaning through. It opens the chest and
  front of the shoulders, which tighten from pressing and from sitting.
setup:
  - Stand in a doorway with your forearms on the frame, elbows at shoulder height or a
    little lower.
  - One foot slightly ahead of the other.
steps:
  - Lean your chest through the doorway until you feel the stretch across the chest.
  - Keep your ribs down and your head in line with your spine.
  - Hold for 20–40 seconds; change the elbow height to hit different fibres.
cues:
  - Lean from the ankles, not by arching the back.
  - Shoulders down and back.
mistakes:
  - Arching the lower back to go deeper.
  - Elbows far above shoulder height, which loads the shoulder joint instead.
safety:
  - Keep it a stretch, not a strain. Back off if the front of the shoulder tingles.
breathing: Breathe out as you lean in.
videos:
  youtube: https://www.youtube.com/watch?v=YAtrTy1C2Fs
tags: [chest, home, mobility, stretching]
notes: >-
  Needs a doorway. Covers the two-arm version
