slug: kneeling-triceps-extension
name: Kneeling Triceps Extension
status: published
level: intermediate
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [triceps]
  secondary: [abs]
equipment: []
lists: [full_push, chest_focus, shoulder_focus]
summary: >-
  A bodyweight triceps extension from the knees, lowering the body by bending the
  elbows with the hands on the floor. Builds the triceps with no equipment.
setup:
  - Kneel and place your hands on the floor shoulder-width apart, body in a straight
    line from knees to head.
  - Walk the hands a little forward of the shoulders.
steps:
  - Bend only the elbows, lowering until your forearms are flat on the floor.
  - Pause.
  - Push back up by straightening the elbows without letting the shoulders travel.
cues:
  - Elbows point straight back.
  - Keep the hips in line with the body.
mistakes:
  - Turning it into a push-up by bending at the shoulders.
  - Hips piking up.
safety:
  - Use a mat under the knees and forearms.
breathing: Breathe in down, out up.
progressions: [straight-leg-triceps-extension]
videos:
  youtube: https://www.youtube.com/watch?v=PuS4aqUKXNY
tags: [bodyweight, extension, home, triceps]
notes: >-
  Bodyweight skull crusher from the knees. Also covers "bodyweight triceps extensions"
  on your triceps list
