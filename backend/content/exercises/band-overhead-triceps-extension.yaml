slug: band-overhead-triceps-extension
name: Band Overhead Triceps Extension
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [triceps]
equipment: [bands]
summary: >-
  An overhead triceps extension with a band under your feet. The band stretches the
  long head and gets heavier at lockout.
setup:
  - Stand on the band and hold the other end behind your head with both hands, elbows up
    by the ears.
steps:
  - Extend the arms overhead until straight.
  - Squeeze the triceps at the top.
  - Lower slowly until the forearms touch the biceps.
cues:
  - Elbows stay close to the head.
  - Keep the core braced.
mistakes:
  - Elbows flaring out.
  - Arching the lower back.
safety:
  - Check the band before use.
breathing: Breathe out as you extend.
videos:
  youtube: https://www.youtube.com/watch?v=uXnYNighAIQ
tags: [bands, extension, hybrid, triceps]
notes: >-
  Long-head work without dumbbells
