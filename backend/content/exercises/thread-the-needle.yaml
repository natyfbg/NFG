slug: thread-the-needle
name: Thread the Needle
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [upper_back]
  secondary: [rear_delts]
equipment: []
summary: >-
  From hands and knees, sliding one arm under the body to rotate the upper back. Frees
  the mid-back and the back of the shoulders.
setup:
  - Start on hands and knees, wrists under shoulders, knees under hips.
steps:
  - Lift one hand and reach it under your body, palm up, lowering that shoulder and ear
    to the floor.
  - Reach as far as you can, feeling the twist through the upper back.
  - Return and reach the same arm up toward the ceiling, opening the chest. Do 6–8 per
    side.
cues:
  - Keep the hips still; the twist is in the ribs.
  - Let the head follow the hand.
mistakes:
  - Shifting the hips sideways.
  - Collapsing onto the supporting arm.
safety:
  - Keep the range easy on the neck; rest the shoulder, not the head, on the floor.
breathing: Breathe out as you thread under.
videos:
  youtube: https://www.youtube.com/watch?v=oAQ_qycUj5o
tags: [back, home, mobility, shoulders, stretching, warm-up]
notes: >-
  Upper-back rotation. Covers the open book
