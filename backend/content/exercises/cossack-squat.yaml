slug: cossack-squat
name: Cossack Squat
status: published
level: intermediate
category: strength
movement: squat
mechanics: compound
laterality: bilateral
muscles:
  primary: [quads, adductors, glutes]
  secondary: [hamstrings]
equipment: []
lists: [lower]
summary: >-
  A deep side lunge with one leg straight and the other bent, shifting from side to
  side. Opens the hips and inner thighs while building single-leg strength.
setup:
  - Stand with the feet very wide, toes forward.
steps:
  - Shift to one side, bending that knee and sitting the hips down while the other leg
    stays straight with the toes up.
  - Go as low as the hip allows.
  - Push back to centre and shift to the other side.
cues:
  - Keep the chest up and the heel down on the bent leg.
  - Toes of the straight leg point up.
mistakes:
  - Rounding the back.
  - Heel lifting on the bent leg.
safety:
  - Hold a post for balance and depth.
breathing: Breathe in as you sit, out as you push back.
videos:
