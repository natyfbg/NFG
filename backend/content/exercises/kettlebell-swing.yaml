slug: kettlebell-swing
name: Kettlebell Swing
status: published
level: intermediate
category: strength
movement: hinge
mechanics: compound
laterality: bilateral
muscles:
  primary: [glutes, hamstrings]
  secondary: [lower_back, abs, forearms]
equipment: [kettlebell]
summary: >-
  Swinging a kettlebell to chest height with a snap of the hips. It builds powerful
  glutes and hamstrings and gets your heart rate up fast.
setup:
  - Stand with your feet a little wider than shoulder-width, a kettlebell on the floor a
    foot in front of you.
  - Hinge at the hips and grip the handle with both hands.
  - Tilt the bell toward you, back flat.
steps:
  - Hike the bell back between your legs like a football snap.
  - Snap your hips forward to stand tall, letting the bell float up to about chest
    height.
  - Let it fall, and hinge back as it swings between your legs.
  - Repeat in a smooth rhythm.
cues:
  - It's a hip hinge, not a squat.
  - The hips move the bell; the arms just guide it.
  - Stand tall and squeeze the glutes at the top.
mistakes:
  - Lifting the bell with the arms or shoulders.
  - Squatting down instead of hinging back.
  - Leaning back at the top.
safety:
  - Learn the hinge with the Romanian deadlift first. Clear space around you and keep a
    firm grip.
breathing: Breathe in as the bell swings back, out sharply as your hips snap forward.
regressions: [dumbbell-romanian-deadlift]
tags: [hinge, glutes, hamstrings, kettlebell, power, conditioning]
