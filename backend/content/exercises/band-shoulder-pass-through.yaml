slug: band-shoulder-pass-through
name: Band Shoulder Pass-Through
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [front_delts, chest]
  secondary: [rear_delts]
equipment: [bands]
summary: >-
  Holding a band wide and taking it from in front of you, over your head, to behind
  you and back. It restores overhead range and wakes up the muscles around the
  shoulder blades.
setup:
  - Hold a light band with a wide overhand grip, arms straight in front of your hips.
  - Stand tall, ribs down, core lightly braced.
steps:
  - Keeping the arms straight, raise the band up and over your head.
  - Continue until the band touches your lower back, then reverse the path.
  - Narrow your grip over time as the shoulders loosen.
cues:
  - Arms stay straight the whole way round.
  - If you have to bend an elbow, take a wider grip.
mistakes:
  - Arching the lower back to get the band over.
  - Grip too narrow for your current range.
safety:
  - Use a light band and a wide grip. Never force the band through a sticking point.
breathing: Breathe out as the band passes over your head.
videos:
  youtube: https://www.youtube.com/watch?v=riVxa9By-pM
tags: [hybrid, mobility, shoulders, warm-up]
notes: >-
  A broomstick works too
