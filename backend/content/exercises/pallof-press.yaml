slug: pallof-press
name: Pallof Press
status: published
level: beginner
category: strength
movement: core
mechanics: compound
laterality: unilateral
muscles:
  primary: [obliques, abs]
  secondary: [front_delts]
equipment: [bands]
summary: >-
  Standing side-on to a band and pressing it straight out without letting it twist
  you. It trains your core to resist rotation, which protects your back.
setup:
  - Anchor a resistance band at chest height (or use a cable set to chest height).
  - Stand side-on to the anchor and hold the band with both hands at your chest.
  - Step away until the band is taut, feet shoulder-width apart, knees soft.
steps:
  - Press the band straight out in front of your chest.
  - Hold for a second without letting your body turn toward the anchor.
  - Bring your hands back to your chest.
  - Finish the reps, then turn around and repeat on the other side.
cues:
  - Keep your hips and shoulders square to the front.
  - Brace your core like you're about to be pushed.
  - Press straight out, not toward the anchor.
mistakes:
  - Letting the band twist your torso.
  - Leaning away from the anchor.
  - Shrugging the shoulders.
safety:
  - Check the band is anchored securely before you step away.
breathing: Breathe out as you press out, in as you bring your hands back.
videos:
