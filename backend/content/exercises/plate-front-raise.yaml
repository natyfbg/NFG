slug: plate-front-raise
name: Plate Front Raise
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [front_delts]
  secondary: [upper_chest]
equipment: [barbell]
summary: >-
  A front raise holding a weight plate with both hands. Simple, and the plate's width
  keeps the shoulders in a comfortable position.
setup:
  - Hold a plate with both hands at the sides (like a steering wheel), in front of the
    thighs.
steps:
  - Raise the plate in front to shoulder height, arms nearly straight.
  - Pause.
  - Lower slowly.
cues:
  - Brace the core.
  - Don't shrug.
mistakes:
  - Leaning back.
  - Raising above eye level.
safety:
  - Grip the plate firmly.
breathing: Breathe out as you raise.
videos:
  youtube: https://www.youtube.com/watch?v=xd1J8R74n-Q
tags: [gym, raise, shoulders]
notes: >-
  Your "plate/barbell front raise", split in two
