slug: seated-spinal-twist
name: Seated Spinal Twist
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [obliques, lower_back]
equipment: []
summary: >-
  Sitting tall and rotating the torso with one knee crossed over. Keeps the mid-back
  rotating freely, which rows, carries and daily life all need.
setup:
  - Sit with legs extended. Cross one foot over the opposite knee, placing it flat.
  - Sit tall on your sit bones.
steps:
  - Hug the bent knee with the opposite arm and rotate your torso toward it.
  - Place the other hand on the floor behind you and lengthen the spine as you twist.
  - Hold for 20–30 seconds and switch sides.
cues:
  - Grow tall before you turn; twist from the mid-back.
  - Keep both sit bones down.
mistakes:
  - Rounding the back and twisting from the neck.
  - Cranking into the twist with the arm.
safety:
  - Turn only as far as the spine moves comfortably.
breathing: Breathe in to lengthen, out to rotate a little further.
videos:
  youtube: https://www.youtube.com/watch?v=0hs1JY29Ggk
tags: [back, home, mobility, stretching]
notes: >-
  Covers lying trunk rotations
