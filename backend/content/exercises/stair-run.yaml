slug: stair-run
name: Stair Run
status: draft
level: intermediate
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [quads, glutes, calves]
equipment: []
summary: >-
  Running up real stairs and walking back down. Free, hard, and great for the legs and
  lungs.
setup:
  - Find a flight of 20 or more stairs with good footing. Warm up with a few easy
    climbs.
steps:
  - Run up the stairs, driving the knees and pumping the arms.
  - Walk down to recover.
  - Do 6–10 climbs.
cues:
  - Land on the ball of the foot on each step.
  - Lean slightly forward from the ankles.
mistakes:
  - Running down the stairs.
  - Looking at your feet with a rounded back.
safety:
  - Always walk the descent. Skip rain-slick stairs.
breathing: Breathe hard up, recover down.
videos:
  youtube: https://www.youtube.com/watch?v=MLkoatYGG9s
tags: [cardio, conditioning, home, intervals, running]
notes: >-
  Run up, walk down. Needs stairs
