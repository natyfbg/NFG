slug: cobra-push-up
name: Cobra Push-Up
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [lower_back]
equipment: []
lists: [pull]
summary: >-
  Pressing the chest up from face down with the hips staying on the floor. A back
  extension that also stretches the abs and hip flexors.
setup:
  - Lie face down with the hands under the shoulders.
steps:
  - Press the chest up, letting the back arch while the hips stay on the floor.
  - Pause at the top.
  - Lower slowly.
cues:
  - Squeeze the glutes to protect the lower back.
  - Shoulders down and back.
mistakes:
  - Hips lifting.
  - Shrugging at the top.
safety:
  - Keep the range comfortable for the lower back.
breathing: Breathe out as you press up.
videos:
  youtube: https://www.youtube.com/watch?v=nLimuNIob7o
tags: [back, bodyweight, home, lower-back, mobility]
notes: >-
  Press up into a cobra mostly with the lower back, arms barely pushing. Also covers
  the cobra stretch on the mobility list
