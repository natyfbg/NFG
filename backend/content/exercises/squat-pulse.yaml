slug: squat-pulse
name: Squat Pulse
status: published
level: beginner
category: strength
movement: squat
mechanics: compound
laterality: bilateral
muscles:
  primary: [quads, glutes]
  secondary: [adductors]
equipment: []
lists: [lower]
summary: >-
  Small up-and-down pulses at the bottom of a squat. Keeps the quads under tension for
  a long burn.
setup:
  - Stand with the feet shoulder-width apart and squat to parallel.
steps:
  - Pulse up and down a few inches, staying in the bottom half.
  - Keep going for 15–30 seconds.
  - Stand up to finish.
cues:
  - Chest up, heels down.
  - Small, controlled pulses.
mistakes:
  - Standing up between pulses.
  - Bouncing on the knees.
safety:
  - Keep the knees tracking over the toes.
breathing: Breathe steadily through the pulses.
videos:
  youtube: https://www.youtube.com/watch?v=OXKOvVi-ZT4
tags: [bodyweight, home, quads, squat]
notes: >-
  Small pulses near the bottom of a squat
