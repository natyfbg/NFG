slug: freestanding-handstand
name: Freestanding Handstand
status: published
level: advanced
category: strength
movement: vertical_push
mechanics: compound
laterality: bilateral
muscles:
  primary: [front_delts]
  secondary: [triceps, traps, abs]
equipment: []
summary: >-
  A handstand with no wall. Mostly a balance skill, but it demands strong, stable
  shoulders and a locked-in core.
setup:
  - Warm up the wrists. Start with a few wall holds.
  - Hands shoulder-width apart, fingers spread.
steps:
  - Kick up with one leg while pushing the floor away.
  - Find balance by pressing the fingertips into the floor; join the legs overhead.
  - Hold as long as you can and come down safely.
cues:
  - Push tall; shoulders by the ears.
  - Fingertips are your brakes.
mistakes:
  - Looking forward instead of at the floor.
  - Arching the back to balance.
safety:
  - Practise on a soft floor and learn to bail with a cartwheel first.
breathing: Breathe normally.
regressions: [wall-handstand-hold]
