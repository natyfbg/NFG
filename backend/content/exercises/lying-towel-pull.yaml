slug: lying-towel-pull
name: Lying Towel Pull
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [lats, upper_back]
  secondary: [rear_delts, lower_back, biceps]
equipment: []
lists: [pull]
summary: >-
  Lying face down and pulling a towel toward you with the arms, elbows driving back. A
  rowing pattern with no equipment, perfect for home.
setup:
  - Lie face down holding a towel taut between the hands, arms extended overhead.
steps:
  - Pull the towel toward the chest, driving the elbows back and down, keeping it taut.
  - Squeeze the shoulder blades.
  - Extend back overhead.
cues:
  - Keep the towel tight the whole time.
  - Chest slightly lifted.
mistakes:
  - Letting the towel go slack.
  - Arching hard.
safety:
  - Bodyweight only.
breathing: Breathe out as you pull.
videos:
  youtube: https://www.youtube.com/watch?v=62NT4yA4igM
tags: [back, bodyweight, home, row]
notes: >-
  Your "Towel Pulls". Lie on your chest, arms forward holding a towel tight, pull it
  down to your chin
