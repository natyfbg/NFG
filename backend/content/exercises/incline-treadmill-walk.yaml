slug: incline-treadmill-walk
name: Incline Treadmill Walk
status: published
level: beginner
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [glutes, calves]
  secondary: [hamstrings, quads]
equipment: [cardio_machine]
summary: >-
  Walking on a steep incline without holding the rails. It raises the heart rate like
  a jog while loading the glutes and calves, with no impact.
setup:
  - Set the speed to 4.5–6 km/h and the incline to 8–15%.
  - Let go of the rails and swing the arms.
steps:
  - Walk tall, pushing off the back foot and driving the knees up the slope.
  - Hold the pace for 15–30 minutes.
  - Raise the incline before the speed when it gets easy.
cues:
  - Hands off the rails; that's half the workout.
  - Full strides, heel to toe.
mistakes:
  - Hanging on the rails, which removes most of the effort.
  - Leaning back against the incline.
safety:
  - Lower the incline if the calves cramp or the lower back arches.
breathing: Steady breathing; you should be able to speak in short sentences.
videos:
  youtube: https://www.youtube.com/watch?v=Ii71nAaRc_8
tags: [cardio, conditioning, glutes, gym, low-impact, steady]
