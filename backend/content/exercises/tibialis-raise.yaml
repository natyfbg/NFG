slug: tibialis-raise
name: Tibialis Raise
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [calves]
equipment: []
summary: >-
  Lifting the toes toward the shins while leaning against a wall. Strengthens the
  front of the shin, which protects knees and ankles.
setup:
  - Lean your back against a wall with the feet about a foot in front, heels on the
    floor.
steps:
  - Lift the toes and balls of the feet as high as you can, keeping the heels down.
  - Pause.
  - Lower slowly. Do 15–25 reps.
cues:
  - Keep the legs straight.
  - Move the feet further from the wall to make it harder.
mistakes:
  - Bending the knees.
  - Rushing.
safety:
  - Bodyweight is plenty to start.
breathing: Breathe normally.
videos:
