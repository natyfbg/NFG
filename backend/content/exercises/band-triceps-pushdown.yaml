slug: band-triceps-pushdown
name: Band Triceps Pushdown
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [triceps]
equipment: [bands]
summary: >-
  A pushdown with a band anchored overhead. Same movement as the cable version,
  anywhere.
setup:
  - Anchor the band high (a door anchor or pull-up bar). Hold the ends with the elbows
    at your sides, forearms up.
steps:
  - Push the hands down until the arms are straight.
  - Squeeze the triceps at the bottom.
  - Return slowly to the start, elbows still at the sides.
cues:
  - Elbows pinned to the ribs.
  - Only the forearms move.
mistakes:
  - Letting the elbows drift forward.
  - Leaning on the band.
safety:
  - Make sure the anchor is secure.
breathing: Breathe out as you push down.
videos:
  youtube: https://www.youtube.com/watch?v=Qenwe2_7IHE
tags: [bands, hybrid, pushdown, triceps]
notes: >-
  Band anchored overhead
