slug: leg-swings
name: Leg Swings
status: published
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [hamstrings, hip_flexors]
  secondary: [glutes]
equipment: []
summary: >-
  Swinging one leg forward and back, then side to side, while holding something for
  balance. Loosens the hips and hamstrings dynamically before squats, lunges or
  running.
setup:
  - Stand beside a wall or rack and hold it with one hand.
  - Stand tall on one leg with a soft knee.
steps:
  - Swing the free leg forward and back, letting it rise a little higher each time.
  - Do 10–15 swings, then turn to face the support and swing the leg side to side across
    your body.
  - Switch legs.
cues:
  - Swing from the hip with the torso still.
  - Let momentum grow the range; don't force the height.
mistakes:
  - Rounding or arching the back to swing higher.
  - Locking the standing knee.
safety:
  - Keep swings controlled. This is a warm-up, not a kick.
breathing: Breathe normally.
videos:
  youtube: https://www.youtube.com/watch?v=difYoBtZi2s
tags: [hips, home, mobility, warm-up]
notes: >-
  Dynamic warm-up
