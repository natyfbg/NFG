slug: figure-four-glute-stretch
name: Figure-Four Glute Stretch
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [glutes]
equipment: []
summary: >-
  Lying on your back with one ankle crossed over the other knee and pulling the legs
  in. The go-to stretch for tight glutes and deep hip muscles after lower-body days.
setup:
  - Lie on your back with knees bent and feet flat.
  - Cross one ankle over the opposite knee.
steps:
  - Thread your hands behind the uncrossed thigh and pull it toward your chest.
  - Keep the crossed knee pushing gently away to deepen the stretch.
  - Hold for 30–45 seconds and switch sides.
cues:
  - Head and shoulders stay on the floor.
  - Flex the crossed foot to protect the knee.
mistakes:
  - Lifting the head and straining the neck.
  - Letting the hips tilt to one side.
safety:
  - Pull only as far as the glute stretches comfortably; no force on the knee.
breathing: Breathe slowly; pull a little closer on each breath out.
videos:
