slug: skater-jump
name: Skater Jump
status: draft
level: intermediate
category: plyometric
movement: lunge
mechanics: compound
laterality: unilateral
muscles:
  primary: [glutes, quads]
  secondary: [abductors, calves]
equipment: []
summary: >-
  Jumping sideways from one leg to the other and landing in a single-leg squat. Power
  plus side-to-side stability for the glutes.
setup:
  - Stand on one leg with a soft knee.
steps:
  - Push off sideways and land on the other leg, letting the free leg swing behind.
  - Absorb the landing with a bent knee.
  - Push off again the other way. Go for 20–40 seconds.
cues:
  - Land softly, knee over the toes.
  - Stay low between jumps.
mistakes:
  - Knee caving inward on landing.
  - Standing up tall between jumps.
safety:
  - Keep the jumps short until the landings are quiet.
breathing: Breathe out on each push-off.
videos:
  youtube: https://www.youtube.com/watch?v=95Qxcy9xm0U
tags: [explosive, glutes, home, unilateral]
notes: >-
  Plyometric. Side to side, landing on one leg
