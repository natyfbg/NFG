slug: jump-rope
name: Jump Rope
status: draft
level: beginner
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [calves]
  secondary: [front_delts, forearms]
equipment: [jump_rope]
summary: >-
  Skipping with a rope at a steady rhythm. Light on the joints when done well, and it
  builds calves, coordination and conditioning cheaply.
setup:
  - "Stand on the middle of the rope: the handles should reach your armpits."
  - Elbows close to the ribs, rope behind the heels.
steps:
  - Swing the rope with small wrist circles and hop over it with both feet, an inch or
    two off the floor.
  - Keep a steady rhythm for 30–60 seconds, rest 30, and repeat for 5–10 rounds.
  - Try alternating feet once the two-foot bounce is smooth.
cues:
  - Turn the rope with the wrists, not the arms.
  - Land softly on the balls of the feet, knees soft.
mistakes:
  - Jumping too high.
  - Elbows flaring out, which shortens the rope.
safety:
  - Skip on a forgiving floor and build time slowly; the calves need a few weeks to
    adapt.
breathing: Rhythmic breathing in time with the rope.
videos:
