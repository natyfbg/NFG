slug: leaning-cable-lateral-raise
name: Leaning Cable Lateral Raise
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [side_delts]
equipment: [cable]
lists: [full_push, shoulder_focus]
summary: >-
  A one-arm cable lateral raise while leaning away from the machine. Constant tension
  plus the lean equals the hardest-working side delt.
setup:
  - Set the pulley low. Stand side-on, hold the machine with the near hand and lean
    away.
  - Hold the handle in the far hand, cable running across the body.
steps:
  - Raise the arm out to the side to shoulder height.
  - Pause.
  - Lower slowly. Switch sides after the set.
cues:
  - Keep the lean and the shoulder down.
  - Elbow slightly bent and leading.
mistakes:
  - Shrugging.
  - Straightening up as you lift.
safety:
  - Light weight; the delt is small.
breathing: Breathe out as you raise.
videos:
  youtube: https://www.youtube.com/watch?v=E5sNaqFdAEI
tags: [cable, gym, raise, shoulders, unilateral]
notes: >-
  Leaning variant of Single-Arm Cable Lateral Raise
