slug: brisk-walk
name: Brisk Walk
status: draft
level: beginner
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [calves, quads, glutes]
equipment: []
summary: >-
  Walking fast enough that talking takes a little effort. The easiest cardio there is,
  and the one most people should do more of.
setup:
  - Comfortable shoes, a route you like, and 20–45 minutes.
steps:
  - Walk at a pace that raises your breathing but still lets you speak in sentences.
  - Swing the arms and keep a tall posture.
  - Aim for 20–45 minutes, most days.
cues:
  - Push off through the toes with each step.
  - Look ahead, not down.
mistakes:
  - Strolling, which doesn't raise the heart rate.
  - Hunching over a phone.
safety:
  - Ideal on rest days; it aids recovery rather than costing it.
breathing: Natural breathing; it should feel brisk, not breathless.
