slug: world-s-greatest-stretch
name: World's Greatest Stretch
status: published
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [hip_flexors, glutes]
  secondary: [hamstrings, upper_back]
equipment: []
summary: >-
  A lunge with a hand on the floor, an elbow drop to the instep and a reach to the
  ceiling. It covers hips, hamstrings, upper back and shoulders in one move, hence the
  name.
setup:
  - Step one foot forward into a long lunge, back leg straight, hands on the floor
    inside the front foot.
steps:
  - Drop the elbow on the front-foot side toward the instep.
  - Rotate that arm up toward the ceiling, following it with your eyes.
  - Return the hand to the floor; do 4–6 slow reps and switch sides.
cues:
  - Back knee off the floor, glute squeezed.
  - Rotate from the upper back, not the lower.
mistakes:
  - Letting the front knee cave in.
  - Rushing the rotation.
safety:
  - Shorten the lunge if the back hip feels pulled rather than stretched.
breathing: Breathe out as you rotate up.
videos:
  youtube: https://www.youtube.com/watch?v=uIFKmkvgw8w
tags: [full-body, hips, home, mobility, warm-up]
notes: >-
  Lunge, open the hip, rotate. Covers the lunge with rotation
