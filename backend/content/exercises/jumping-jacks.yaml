slug: jumping-jacks
name: Jumping Jacks
status: draft
level: beginner
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [calves, side_delts]
equipment: []
summary: >-
  Jumping the feet apart while swinging the arms overhead, then back together. The
  simplest full-body warm-up.
setup:
  - Stand with feet together and arms at your sides.
steps:
  - Jump the feet out wide while raising the arms overhead.
  - Jump back to the start.
  - Keep a steady rhythm for 30–60 seconds.
cues:
  - Land softly on the balls of the feet.
  - Arms straight, all the way up.
mistakes:
  - Stiff, heavy landings.
  - Half-raising the arms.
safety:
  - Step the feet out one at a time for a no-jump version.
breathing: Breathe in rhythm with the jumps.
videos:
  youtube: https://www.youtube.com/watch?v=BNbF52zYRIM
tags: [cardio, conditioning, home, warm-up]
notes: >-
  Step jacks are the low-impact version, covered in the how-to
