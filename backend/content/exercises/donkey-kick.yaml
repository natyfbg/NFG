slug: donkey-kick
name: Donkey Kick
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [glutes]
  secondary: [hamstrings]
equipment: []
summary: >-
  From hands and knees, driving one bent leg up toward the ceiling. Simple glute
  isolation with no equipment.
setup:
  - Start on hands and knees, wrists under shoulders, knees under hips.
steps:
  - Keeping the knee bent at 90 degrees, drive the foot up toward the ceiling.
  - Squeeze the glute at the top.
  - Lower slowly. Switch legs after the set.
cues:
  - Hips stay level and the back stays flat.
  - Lead with the heel.
mistakes:
  - Arching the back.
  - Rotating the hips.
safety:
  - Keep the range where the back stays flat.
breathing: Breathe out as you kick up.
videos:
  youtube: https://www.youtube.com/watch?v=vElEKAdulIE
tags: [bodyweight, glutes, home, unilateral]
notes: >-
  On hands and knees, drive one heel up
