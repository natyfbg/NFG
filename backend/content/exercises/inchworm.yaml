slug: inchworm
name: Inchworm
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [hamstrings, abs]
  secondary: [front_delts]
equipment: []
summary: >-
  Folding forward, walking the hands out to a plank and walking the feet back in. A
  full-body warm-up that stretches the hamstrings and switches on the core and
  shoulders.
setup:
  - Stand tall with your feet hip-width apart.
steps:
  - Hinge at the hips and put your hands on the floor, bending the knees as needed.
  - Walk your hands forward until you're in a straight plank.
  - Walk your feet toward your hands, keeping the legs as straight as you can, then
    stand.
  - Repeat for 5–8 reps.
cues:
  - Brace the core when you reach the plank; don't let the hips sag.
  - Small steps with the feet keep the hamstrings stretching.
mistakes:
  - Sagging hips in the plank.
  - Rounding the back heavily on the walk-in.
safety:
  - Bend the knees freely on the way down if your hamstrings are tight.
breathing: Breathe out as you walk the hands out.
videos:
