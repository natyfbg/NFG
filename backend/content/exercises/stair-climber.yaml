slug: stair-climber
name: Stair Climber
status: draft
level: intermediate
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [glutes, quads]
  secondary: [calves, hamstrings]
equipment: [cardio_machine]
summary: >-
  Climbing an endless rotating staircase. Gets the heart rate up fast while working
  the glutes and quads, with less impact than running.
setup:
  - Step on and pick a comfortable step rate. Rest the fingertips on the rails for
    balance only.
steps:
  - Climb with full steps, placing the whole foot on each stair.
  - Stand tall and drive through the heel.
  - Hold a steady pace for 10–20 minutes, or alternate 1 minute fast with 2 minutes
    easy.
cues:
  - Hands light on the rails, not holding your weight.
  - Hips level; don't sway.
mistakes:
  - Leaning heavily on the rails.
  - Taking small steps on the toes.
safety:
  - Lower the pace rather than grabbing the rails when it gets hard.
breathing: Steady breathing.
videos:
  youtube: https://www.youtube.com/watch?v=ww3YV_N6U_U
tags: [cardio, conditioning, glutes, gym, steady]
notes: >-
  Aka StairMaster
