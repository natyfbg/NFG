slug: reverse-snow-angel
name: Reverse Snow Angel
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [rear_delts, upper_back]
  secondary: [traps, lower_back]
equipment: []
lists: [pull]
summary: >-
  Lying face down and sweeping the arms from the hips to overhead with the thumbs up.
  Trains the rear delts, lower traps and rotator cuff.
setup:
  - Lie face down with the arms at the sides, palms down, thumbs out.
steps:
  - Lift the arms off the floor and sweep them out and overhead, rotating the thumbs up.
  - Pause overhead.
  - Sweep back to the hips.
cues:
  - Arms stay off the floor.
  - Shoulders down, not shrugged.
mistakes:
  - Bending the elbows.
  - Arching the back to lift higher.
safety:
  - Keep the range where the shoulders stay down.
breathing: Breathe out as the arms go overhead.
videos:
