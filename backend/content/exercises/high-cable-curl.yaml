slug: high-cable-curl
name: High Cable Curl
status: draft
level: intermediate
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [biceps]
equipment: [cable]
lists: [pull]
summary: >-
  Curling two high cables toward the ears with the arms out to the sides. The arm
  position mimics a front double biceps pose and hammers the peak.
setup:
  - Set both pulleys high. Stand between them holding a handle in each hand, arms out to
    the sides at shoulder height.
steps:
  - Curl both hands toward the ears, keeping the upper arms still.
  - Squeeze hard.
  - Extend slowly back out.
cues:
  - Upper arms stay level with the shoulders.
  - Flex the biceps at the top like a pose.
mistakes:
  - Dropping the elbows.
  - Using the shoulders to pull.
safety:
  - Light weight.
breathing: Breathe out as you curl.
videos:
  youtube: https://www.youtube.com/watch?v=Okl64XegSu0
tags: [biceps, cable, curl, gym]
notes: >-
  Arms out at shoulder height, like a double-biceps pose
