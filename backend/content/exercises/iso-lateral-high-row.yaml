slug: iso-lateral-high-row
name: Iso-Lateral High Row
status: draft
level: beginner
category: strength
movement: horizontal_pull
mechanics: compound
laterality: bilateral
muscles:
  primary: [lats, upper_back]
  secondary: [biceps, rear_delts]
equipment: [machine]
summary: >-
  A plate-loaded row pulling from high to low, like a pulldown and a row combined.
  Great for the lats with a strong stretch at the top.
setup:
  - Set the seat so the arms are extended up and forward at the start. Lock the thighs
    if there's a pad.
steps:
  - Pull the handles down and back toward the chest, elbows driving down.
  - Squeeze the lats.
  - Return slowly to the stretch.
cues:
  - Chest up as the handles arrive.
  - Shoulders down.
mistakes:
  - Leaning far back.
  - Shrugging at the top.
safety:
  - Set the seat so the start is a comfortable stretch.
breathing: Breathe out as you pull.
videos:
  youtube: https://www.youtube.com/watch?v=oXow-EJlZMU
tags: [back, gym, machine, row]
