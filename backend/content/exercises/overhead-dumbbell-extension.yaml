slug: overhead-dumbbell-extension
name: Overhead Dumbbell Extension
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [triceps]
equipment: [dumbbell]
summary: >-
  Lowering a dumbbell behind your head and pressing it back up. Working overhead
  stretches the long head of the triceps, the biggest part of the muscle.
setup:
  - Sit or stand tall holding one dumbbell with both hands under the top plate.
  - Press it overhead with your arms straight.
  - Keep your ribs down and core braced.
steps:
  - Bend your elbows to lower the dumbbell behind your head.
  - Go as low as is comfortable while your elbows point up.
  - Straighten your arms to press the dumbbell back overhead.
cues:
  - Elbows point forward and up, close to your head.
  - Only the forearms move.
  - Don't arch your lower back.
mistakes:
  - Elbows flaring wide.
  - Arching the back to press the weight up.
  - Rushing the lowering phase.
safety:
  - Hold the dumbbell securely by the plate and don't go heavier than you can control
    behind your head.
breathing: Breathe in as you lower, out as you press.
tags: [triceps, arms, dumbbell]
