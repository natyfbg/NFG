slug: plank-shoulder-tap
name: Plank Shoulder Tap
status: draft
level: beginner
category: strength
movement: core
mechanics: isolation
laterality: bilateral
muscles:
  primary: [abs, front_delts]
  secondary: [obliques]
equipment: []
summary: >-
  A plank where you tap each shoulder with the opposite hand. The core has to fight
  rotation every time a hand leaves the floor.
setup:
  - Take a high plank with the feet wide and the hands under the shoulders.
steps:
  - Lift one hand and tap the opposite shoulder.
  - Place it down and tap with the other hand.
  - Alternate for 20–40 taps.
cues:
  - Hips stay still; imagine a glass of water on your back.
  - Wide feet for stability.
mistakes:
  - Rocking the hips.
  - Rushing.
safety:
  - Drop to the knees for an easier version.
breathing: Breathe steadily.
regressions: [plank]
videos:
  youtube: https://www.youtube.com/watch?v=l2KsRCiDsts
tags: [bodyweight, core, home]
notes: >-
  Keep the hips still while you tap
