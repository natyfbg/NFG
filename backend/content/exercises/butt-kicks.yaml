slug: butt-kicks
name: Butt Kicks
status: draft
level: beginner
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [hamstrings, calves]
equipment: []
summary: >-
  Jogging on the spot while kicking the heels up toward the glutes. Warms up the
  hamstrings and raises the heart rate before running or leg work.
setup:
  - Stand tall with feet hip-width apart.
steps:
  - Jog on the spot, bringing each heel up toward the same-side glute.
  - Pump the arms as if running.
  - Go for 20–40 seconds.
cues:
  - Quick feet, light landings.
  - Knees point down, not forward.
mistakes:
  - Leaning forward from the waist.
  - Stamping instead of bouncing.
safety:
  - Land on the balls of the feet to keep it easy on the knees.
breathing: Rhythmic breathing.
videos:
  youtube: https://www.youtube.com/watch?v=RSY2mAxUPqQ
tags: [cardio, conditioning, home, warm-up]
