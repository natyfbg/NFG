slug: standing-calf-stretch
name: Standing Calf Stretch
status: published
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [calves]
equipment: []
summary: >-
  Pressing the hands into a wall with one leg back and the heel down. Loosens the
  calves so the ankle can bend properly in squats and running.
setup:
  - Face a wall with both hands on it. Step one foot back, toes pointing forward.
steps:
  - Keep the back heel on the floor and the back leg straight; lean into the wall.
  - Hold for 30 seconds.
  - Bend the back knee slightly, keeping the heel down, for the deeper calf muscle. Hold
    again, then switch.
cues:
  - Back toes point straight at the wall.
  - Heel stays glued down.
mistakes:
  - Turning the back foot out.
  - Letting the heel lift to lean further.
safety:
  - Keep the stretch steady; no bouncing.
breathing: Breathe normally.
videos:
  youtube: https://www.youtube.com/watch?v=73DbNhLYVDQ
tags: [calves, home, mobility, stretching]
notes: >-
  Against a wall. Bent-knee version covered in the how-to
