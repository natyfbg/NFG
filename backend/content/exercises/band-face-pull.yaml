slug: band-face-pull
name: Band Face Pull
status: published
level: beginner
category: strength
movement: horizontal_pull
mechanics: isolation
laterality: bilateral
muscles:
  primary: [rear_delts]
  secondary: [upper_back, traps]
equipment: [bands]
summary: >-
  Pulling a band toward your face with your elbows high. A shoulder-health staple that
  trains the rear delts and upper back.
setup:
  - Anchor a light band at about face height, around a post or in a door anchor.
  - Hold one end in each hand, palms facing down, and step back until there's tension.
  - Stand tall with your arms straight in front of you.
steps:
  - Pull the band toward your face, leading with your elbows high and wide.
  - Finish with your hands beside your ears, as if flexing for a double-biceps pose.
  - Hold for a second.
  - Return slowly until your arms are straight.
cues:
  - Elbows stay at or above shoulder height.
  - Pull the band apart as you pull it in.
  - Keep your ribs down; don't lean back.
mistakes:
  - Letting the elbows drop so it becomes a row.
  - Leaning back to move more resistance.
  - Shrugging the shoulders up.
safety:
  - Check the anchor is secure so the band can't slip and snap toward you.
breathing: Breathe out as you pull, in as you return.
tags: [shoulders, rear-delts, bands, posture]
