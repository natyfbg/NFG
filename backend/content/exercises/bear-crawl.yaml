slug: bear-crawl
name: Bear Crawl
status: draft
level: intermediate
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [front_delts, abs, quads]
  secondary: [triceps]
equipment: []
summary: >-
  Crawling on hands and feet with the knees hovering just off the floor. It's cardio,
  core and shoulder work at once, and a great warm-up finisher.
setup:
  - Start on hands and knees, wrists under shoulders. Tuck the toes and lift the knees
    an inch off the floor.
steps:
  - Move the opposite hand and foot together, taking small steps.
  - Crawl forward 10–20 metres, then crawl backward.
  - Keep the hips level and low the whole way.
cues:
  - Knees stay an inch off the floor.
  - Imagine balancing a glass of water on your back.
mistakes:
  - Hips rising high, which turns it into a walk.
  - Taking big steps that twist the hips.
safety:
  - Keep steps small to protect the lower back. Rest when the position starts to
    collapse.
breathing: Breathe steadily; don't hold it while bracing.
