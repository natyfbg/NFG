slug: bayesian-cable-curl
name: Bayesian Cable Curl
status: published
level: intermediate
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [biceps]
equipment: [cable]
lists: [pull]
summary: >-
  A one-arm cable curl facing away from the machine with the arm behind the body. The
  stretched start loads the biceps' long head harder than any other curl.
setup:
  - Set the pulley low and face away from the machine. Hold the handle with the arm
    extended slightly behind the body, palm forward.
steps:
  - Curl the handle up toward the shoulder while keeping the upper arm back.
  - Squeeze.
  - Lower slowly to the stretched position. Switch arms after the set.
cues:
  - Keep the elbow behind the body.
  - Stand tall; don't lean forward.
mistakes:
  - Letting the elbow drift forward.
  - Shortening the range.
safety:
  - Moderate weight; the stretch is intense.
breathing: Breathe out as you curl.
videos:
  youtube: https://www.youtube.com/watch?v=S6HnE1fDlaI
tags: [biceps, cable, curl, gym, unilateral]
notes: >-
  Facing away from the cable, arm behind you. Aka behind-the-body cable curl
