slug: hill-sprint
name: Hill Sprint
status: published
level: advanced
category: cardio
movement: cardio
mechanics: isolation
laterality: bilateral
muscles:
  primary: [glutes, quads, calves]
  secondary: [hamstrings]
equipment: []
summary: >-
  Sprinting up a hill and walking down. The slope forces good running mechanics and
  keeps impact low, so it's the safest way to sprint hard.
setup:
  - Find a hill with a moderate slope and 30–60 metres of clear ground.
  - Warm up with 5–10 minutes of easy jogging and a few strides.
steps:
  - Sprint up the hill at 80–90% effort, driving the knees and pumping the arms.
  - Walk back down to recover fully.
  - Do 6–10 sprints.
cues:
  - Lean into the hill from the ankles, not the waist.
  - Short, quick steps with a high knee drive.
mistakes:
  - Overstriding and landing on the heels.
  - Sprinting on round one before warming up.
safety:
  - "Build up over weeks: start with 4–6 sprints at 70%. Walk the descent; never run
    it."
breathing: Breathe hard on the way up; recover fully on the walk down.
videos:
  youtube: https://www.youtube.com/watch?v=VzHQUh5jzsI
tags: [cardio, conditioning, home, intervals, running]
notes: >-
  Short uphill sprints, walk back down. Needs a hill
