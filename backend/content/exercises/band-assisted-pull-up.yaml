slug: band-assisted-pull-up
name: Band-Assisted Pull-Up
status: draft
level: beginner
category: strength
movement: vertical_pull
mechanics: compound
laterality: bilateral
muscles:
  primary: [lats]
  secondary: [biceps, upper_back]
equipment: [bands, pullup_bar]
summary: >-
  A pull-up with a band looped over the bar and under your foot or knee. The band
  helps most at the bottom, where you're weakest.
setup:
  - Loop a band over the bar and put one knee or foot in it.
  - Hang with a grip slightly wider than the shoulders.
steps:
  - Pull your chest to the bar.
  - Pause with the chin over.
  - Lower all the way to straight arms.
cues:
  - Pull the elbows down to the ribs.
  - Keep the body still; no swinging.
mistakes:
  - Using a band so strong the reps are effortless.
  - Half reps at the bottom.
safety:
  - Hold the band with one hand while placing the foot; bands snap back hard.
breathing: Breathe out as you pull.
progressions: [pull-up]
videos:
  youtube: https://www.youtube.com/watch?v=4yE-XGDWJPg
tags: [back, bands, hybrid, pull-up]
notes: >-
  Home version of the assisted pull-up
