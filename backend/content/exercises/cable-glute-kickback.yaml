slug: cable-glute-kickback
name: Cable Glute Kickback
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: unilateral
muscles:
  primary: [glutes]
  secondary: [hamstrings]
equipment: [cable]
summary: >-
  Kicking one leg back against a low cable with an ankle strap. Isolates the glute
  with constant tension.
setup:
  - Attach an ankle strap to a low pulley. Face the machine, hold it for balance, and
    hinge slightly forward.
steps:
  - Kick the leg straight back, squeezing the glute.
  - Pause at the end.
  - Return under control. Switch legs after the set.
cues:
  - Keep the hips square and the back flat.
  - Move from the hip, not the lower back.
mistakes:
  - Arching the back to kick higher.
  - Swinging.
safety:
  - Light weight; the glute is working through a short range.
breathing: Breathe out as you kick.
videos:
  youtube: https://www.youtube.com/watch?v=VSgMyiOu0uE
tags: [cable, glutes, gym, unilateral]
notes: >-
  Covers the kickback machine too
