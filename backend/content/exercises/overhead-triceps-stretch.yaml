slug: overhead-triceps-stretch
name: Overhead Triceps Stretch
status: published
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [triceps]
  secondary: [lats]
equipment: []
summary: >-
  Reaching one hand down your back with the elbow pointing up and easing the elbow
  back with the other hand. Stretches the triceps and lats after pressing.
setup:
  - Stand tall and reach one arm overhead, then bend the elbow so the hand drops behind
    your neck.
steps:
  - Use the other hand to gently press the elbow back and down.
  - Keep the ribs down and feel it along the back of the upper arm.
  - Hold for 20–30 seconds and switch.
cues:
  - Elbow points at the ceiling.
  - Don't let the head push forward.
mistakes:
  - Arching the back to get the elbow higher.
  - Pulling the elbow sideways across the head.
safety:
  - Ease off if the shoulder pinches; a smaller reach is fine.
breathing: Breathe normally.
videos:
  youtube: https://www.youtube.com/watch?v=o71LMT6ah48
tags: [cool-down, home, mobility, stretching, triceps]
