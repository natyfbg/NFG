slug: wrist-stretch
name: Wrist Stretch
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [forearms]
equipment: []
summary: >-
  Extending and flexing the wrists with light pressure from the other hand. Prepares
  the wrists for push-ups, front squats and handstands.
setup:
  - Stand or kneel. Extend one arm straight in front of you, palm up.
steps:
  - With the other hand, gently pull the fingers back toward you for 15–20 seconds.
  - Turn the palm down and pull the back of the hand toward you for 15–20 seconds.
  - Finish with slow wrist circles each way, then switch hands.
cues:
  - Keep the elbow straight to get the forearm muscles.
  - Gentle pressure, no bouncing.
mistakes:
  - Pulling hard on the fingers.
  - Bending the elbow to make it feel bigger.
safety:
  - Keep it pain-free; the wrist should feel stretched, never strained.
breathing: Breathe normally.
videos:
  youtube: https://www.youtube.com/watch?v=rQlDHgTUbO0
tags: [forearms, home, mobility, warm-up, wrists]
notes: >-
  Palm up and palm down. Useful before push-ups and handstands
