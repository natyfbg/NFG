slug: alternating-seated-dumbbell-shoulder-press
name: Alternating Seated Dumbbell Shoulder Press
status: published
level: beginner
category: strength
movement: vertical_push
mechanics: compound
laterality: unilateral
muscles:
  primary: [front_delts, side_delts]
  secondary: [triceps]
equipment: [dumbbell, bench]
summary: >-
  A seated shoulder press one arm at a time, alternating. Each side gets full
  attention and the core works to stay square.
setup:
  - Sit on an upright bench with dumbbells at shoulder height, palms forward.
steps:
  - Press one dumbbell overhead while the other stays at the shoulder.
  - Lower it and press the other.
  - Alternate for all reps; count each arm.
cues:
  - Stay square; don't lean away from the pressing arm.
  - Keep the resting dumbbell steady at the shoulder.
mistakes:
  - Leaning sideways to help the press.
  - Letting the resting arm drop.
safety:
  - Use a bench with a back support for the first weeks.
breathing: Breathe out on each press.
videos:
  youtube: https://www.youtube.com/watch?v=57m3lpo9YBQ
tags: [hybrid, press, shoulders, unilateral]
notes: >-
  One arm at a time
