slug: arm-circles
name: Arm Circles
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [front_delts, side_delts]
  secondary: [rear_delts]
equipment: []
summary: >-
  Small-to-large circles with straight arms, forward then backward. Warms up the
  shoulders and gets blood into the rotator cuff before any pressing or pulling.
setup:
  - Stand tall with your arms out to the sides at shoulder height, palms down.
steps:
  - Draw small circles with your fingertips, keeping the arms straight.
  - Grow the circles over 15–20 seconds until they're as big as your shoulders allow.
  - Reverse the direction and repeat.
cues:
  - Shoulders down, away from your ears.
  - Keep the circles smooth and even.
mistakes:
  - Shrugging the shoulders up as the arms tire.
  - Bending the elbows to make it easier.
safety:
  - Stop short of any pinch at the top of the shoulder; keep circles smaller if so.
breathing: Breathe normally throughout.
videos:
  youtube: https://www.youtube.com/watch?v=RN40wyH6x9o
tags: [home, mobility, shoulders, warm-up]
notes: >-
  Dynamic warm-up
