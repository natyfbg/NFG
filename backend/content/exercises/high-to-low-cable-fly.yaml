slug: high-to-low-cable-fly
name: High-to-Low Cable Fly
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [chest]
  secondary: [front_delts]
equipment: [cable]
lists: [full_push, chest_focus, shoulder_focus]
summary: >-
  A cable fly with the pulleys set high, sweeping the hands down and together. It hits
  the lower chest and gives a strong contraction at the finish.
setup:
  - Set both pulleys high and grab the handles. Step forward into a staggered stance.
  - Start with arms out wide, elbows slightly bent, chest up.
steps:
  - Sweep the hands down and together in front of your hips.
  - Squeeze the chest hard with the hands touching.
  - Return slowly to the wide position.
cues:
  - Keep the slight elbow bend throughout.
  - Lead with the chest, not the hands.
mistakes:
  - Bending the elbows to turn it into a press.
  - Leaning forward and using bodyweight.
safety:
  - Don't let the weight pull the shoulders back past a comfortable stretch.
breathing: Breathe out as the hands come together.
videos:
  youtube: https://www.youtube.com/watch?v=Rwz69lvgJys
tags: [cable, chest, fly, gym]
notes: >-
  Lower-chest emphasis
