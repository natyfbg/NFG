slug: heel-elevated-squat
name: Heel-Elevated Squat
status: draft
level: beginner
category: strength
movement: squat
mechanics: compound
laterality: bilateral
muscles:
  primary: [quads]
  secondary: [glutes]
equipment: []
summary: >-
  A squat with the heels on a plate or wedge. Raising the heels lets you stay upright
  and go deeper, putting more on the quads.
setup:
  - Stand with the heels on a plate or wedge, feet hip- to shoulder-width apart. Hold a
    dumbbell at the chest or go bodyweight.
steps:
  - Squat down as deep as you can with an upright torso.
  - Pause at the bottom.
  - Drive up through the whole foot.
cues:
  - Knees travel forward over the toes.
  - Stay tall.
mistakes:
  - Leaning forward.
  - Letting the heels roll off the plate.
safety:
  - Keep the plate stable and the heels fully on it.
breathing: Breathe in down, out up.
videos:
  youtube: https://www.youtube.com/watch?v=UvxTioyshwQ
tags: [home, quads, squat]
notes: >-
  Heels on a plate or step. Also covers the cyclist squat (feet close together)
