slug: kneeling-hip-flexor-stretch
name: Kneeling Hip Flexor Stretch
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [hip_flexors, quads]
equipment: []
summary: >-
  A half-kneeling lunge with the hips pushed forward. It lengthens the hip flexors
  that shorten from sitting and pull the lower back into an arch.
setup:
  - Kneel on one knee with the other foot flat in front, both knees around 90 degrees.
  - Place a pad under the back knee.
steps:
  - Tuck your tailbone and squeeze the glute of the kneeling leg.
  - Shift your hips forward until you feel the stretch at the front of the kneeling hip.
  - Hold for 30–45 seconds and switch.
cues:
  - Squeeze the glute first; that's what finds the stretch.
  - Ribs stacked over hips, no arching.
mistakes:
  - Arching the lower back instead of tucking the pelvis.
  - Lunging far forward with the front knee.
safety:
  - Keep the front knee over the ankle. Use a pad for the kneeling knee.
breathing: Breathe out as you shift forward.
videos:
  youtube: https://www.youtube.com/watch?v=KT0HlPGCl6k
tags: [hips, home, mobility, stretching]
notes: >-
  The deeper couch stretch is covered in the how-to
