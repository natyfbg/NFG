slug: butterfly-stretch
name: Butterfly Stretch
status: draft
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [adductors]
equipment: []
summary: >-
  Sitting with the soles of your feet together and letting the knees drop. A gentle
  inner-thigh and hip opener for after leg days or long sitting.
setup:
  - Sit tall with the soles of your feet together, heels a comfortable distance from
    your hips.
  - Hold your feet or ankles.
steps:
  - Let your knees sink toward the floor under their own weight.
  - For more, hinge forward from the hips with a flat back.
  - Hold for 30–60 seconds.
cues:
  - Sit on the front of your sit bones, back straight.
  - Relax the inner thighs rather than pressing the knees down.
mistakes:
  - Rounding the back to get the chest lower.
  - Pushing the knees down with the elbows.
safety:
  - Bring the heels further from your hips if you feel it in the knees instead of the
    inner thighs.
breathing: Slow breaths; sink a little further on each breath out.
videos:
  youtube: https://www.youtube.com/watch?v=oeXsYDBep5s
tags: [hips, home, mobility, stretching]
notes: >-
  Covers the frog and straddle stretches
