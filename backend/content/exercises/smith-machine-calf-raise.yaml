slug: smith-machine-calf-raise
name: Smith Machine Calf Raise
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [calves]
equipment: [smith]
lists: [lower]
summary: >-
  Standing calf raises under the Smith machine bar, feet on a step. Heavy standing
  loading without balance issues.
setup:
  - Place a step or plates under the bar. Stand on them with the heels hanging off, bar
    on the upper back.
steps:
  - Rise onto the balls of the feet as high as possible.
  - Pause.
  - Lower until the heels are below the step.
cues:
  - Knees straight but not locked.
  - Full stretch at the bottom.
mistakes:
  - Bouncing out of the bottom.
  - Short reps.
safety:
  - Set the safety catches.
breathing: Breathe out as you rise.
videos:
  youtube: https://www.youtube.com/watch?v=rh8L34lAKC0
tags: [calves, gym, smith-machine]
notes: >-
  Your "smith machine plate/stage calf raises". Toes on a plate or step
