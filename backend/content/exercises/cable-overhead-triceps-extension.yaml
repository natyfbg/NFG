slug: cable-overhead-triceps-extension
name: Cable Overhead Triceps Extension
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [triceps]
equipment: [cable]
lists: [full_push]
summary: >-
  Extending a rope overhead with the cable set low behind you. The overhead position
  stretches the long head of the triceps, which pushdowns miss.
setup:
  - Set the pulley low, attach a rope, and face away from the machine holding the rope
    behind your head.
  - Staggered stance, elbows up by the ears.
steps:
  - Extend the arms overhead until straight, pulling the rope ends apart at the top.
  - Squeeze the triceps.
  - Lower under control until the forearms touch the biceps.
cues:
  - Elbows stay pointing forward and up.
  - Ribs down; don't arch the lower back.
mistakes:
  - Elbows drifting apart.
  - Leaning far forward.
safety:
  - Keep the weight moderate; the stretched position is where elbows complain.
breathing: Breathe out as you extend.
videos:
  youtube: https://www.youtube.com/watch?v=jioCqlKKrJc
tags: [cable, extension, gym, triceps]
notes: >-
  Covers rope and one-arm versions
