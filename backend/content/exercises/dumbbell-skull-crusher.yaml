slug: dumbbell-skull-crusher
name: Dumbbell Skull Crusher
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [triceps]
equipment: [dumbbell, bench]
summary: >-
  A lying triceps extension with dumbbells. It isolates the triceps with your back
  fully supported.
setup:
  - Lie on a flat bench with a dumbbell in each hand.
  - Press them up over your chest, palms facing each other.
  - Let your arms tilt slightly back toward your head.
steps:
  - Bend your elbows to lower the dumbbells beside your head.
  - Keep your upper arms still.
  - Straighten your arms to bring the dumbbells back up.
cues:
  - Elbows point toward the ceiling, not out.
  - Move slowly, especially at the bottom.
  - Keep a slight backward tilt in your arms to keep tension.
mistakes:
  - Turning it into a press by moving the upper arms.
  - Letting the elbows flare.
  - Going too heavy for a controlled bottom position.
safety:
  - Control the dumbbells near your head at all times; choose a weight you can stop
    easily.
breathing: Breathe in as you lower, out as you extend.
