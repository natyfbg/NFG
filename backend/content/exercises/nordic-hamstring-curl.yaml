slug: nordic-hamstring-curl
name: Nordic Hamstring Curl
status: published
level: advanced
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [hamstrings]
  secondary: [glutes, calves]
equipment: []
summary: >-
  Kneeling with your ankles anchored and slowly lowering your body forward. It's one
  of the toughest hamstring exercises and helps protect against hamstring strains.
setup:
  - Kneel on a pad with your ankles hooked under something sturdy, like a loaded bar, a
    low bench or a partner's hands.
  - Keep your body straight from knees to head, hips extended.
steps:
  - Slowly lean forward from the knees, keeping your hips straight.
  - Resist with your hamstrings for as long as you can.
  - Catch yourself with your hands when you can't hold it any longer.
  - Push off the floor gently and pull yourself back up with your hamstrings.
cues:
  - Lower as slowly as possible.
  - Hips stay straight; don't bend at the waist.
  - Hands ready to catch you.
mistakes:
  - Bending at the hips to make it easier.
  - Dropping fast instead of fighting the descent.
  - Using an anchor that slides.
safety:
  - Start with a few slow reps and expect sore hamstrings for a couple of days. Use a
    secure anchor.
breathing: Breathe out slowly as you lower; breathe in at the bottom.
regressions: [lying-leg-curl, single-leg-glute-bridge]
tags: [hamstrings, bodyweight, isolation, injury-prevention]
