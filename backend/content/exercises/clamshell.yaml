slug: clamshell
name: Clamshell
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [abductors, glutes]
equipment: []
summary: >-
  Lying on your side with the knees bent and opening the top knee like a clam. Wakes
  up the outer glutes before leg work.
setup:
  - Lie on one side with the knees bent at 90 degrees and the feet together, hips
    stacked.
steps:
  - Keeping the feet together, lift the top knee as high as it goes without rolling the
    hips back.
  - Pause.
  - Lower slowly. Do 15–20 reps and switch sides.
cues:
  - Hips stacked, not rolling.
  - Feel it in the side of the glute.
mistakes:
  - Rolling the top hip back.
  - Using momentum.
safety:
  - Add a band above the knees once it's easy.
breathing: Breathe out as you open.
videos:
  youtube: https://www.youtube.com/watch?v=TT__6i6hS5w
tags: [bodyweight, glutes, home, warm-up]
notes: >-
  Lying on your side. Add a band to progress
