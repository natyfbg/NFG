slug: wrist-roller
name: Wrist Roller
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [forearms]
equipment: [machine]
summary: >-
  Winding a weight up on a cord attached to a handle and lowering it back. Burns out
  the forearms in both directions.
setup:
  - Hold the roller with both hands, arms out in front at shoulder height, weight
    hanging.
steps:
  - Roll the handle hand over hand to wind the weight up to the top.
  - Unwind it slowly back down.
  - Reverse the rolling direction on the next set.
cues:
  - Keep the arms up; don't let the shoulders drop.
  - Slow on the way down.
mistakes:
  - Dropping the arms as the forearms burn.
  - Letting the weight unwind freely.
safety:
  - Light weight; the arms-forward position tires fast.
breathing: Breathe steadily.
videos:
  youtube: https://www.youtube.com/watch?v=VPFQSgAiXco
tags: [forearms, grip, gym]
notes: >-
  Roll the weight up, then lower it under control
