slug: cable-pushdown
name: Cable Pushdown
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [triceps]
equipment: [cable]
summary: >-
  Pushing a cable bar or rope down from chest height. Easy to learn and a reliable way
  to train the triceps.
setup:
  - Attach a bar or rope to a high pulley.
  - Grip it and stand close, elbows at your sides and bent about 90°.
  - Lean forward very slightly from the hips.
steps:
  - Push the handle down until your arms are straight.
  - Squeeze your triceps at the bottom.
  - Let it rise slowly back to the start.
cues:
  - Elbows stay glued to your sides.
  - Only the forearms move.
  - With a rope, spread the ends apart at the bottom.
mistakes:
  - Letting the elbows rise and fall.
  - Leaning over the handle to push with bodyweight.
  - Letting the weight yank your hands up.
breathing: Breathe out as you push down, in as you return.
tags: [triceps, arms, cable]
