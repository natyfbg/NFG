slug: plate-pinch-hold
name: Plate Pinch Hold
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [forearms]
equipment: [barbell]
summary: >-
  Pinching one or two plates between the fingers and thumb for time. Thumb and finger
  strength that normal gripping misses.
setup:
  - Hold a plate (or two smooth sides out) by its edge between the thumb and fingers,
    arm at your side.
steps:
  - Lift and hold for 20–40 seconds.
  - Put it down and switch hands.
  - Add a second plate or a heavier one when 40 seconds is easy.
cues:
  - Thumb on one side, fingers on the other.
  - Shoulder down and relaxed.
mistakes:
  - Resting the plate against the leg.
  - Holding the breath.
safety:
  - Keep the feet out of the drop zone.
breathing: Breathe steadily.
videos:
  youtube: https://www.youtube.com/watch?v=UAEEyglVogw
tags: [forearms, grip, gym, hold]
notes: >-
  Pinch two plates together, smooth sides out. Covers walking with them
