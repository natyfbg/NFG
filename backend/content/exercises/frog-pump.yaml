slug: frog-pump
name: Frog Pump
status: published
level: beginner
category: strength
movement: hinge
mechanics: compound
laterality: bilateral
muscles:
  primary: [glutes]
equipment: []
summary: >-
  A glute bridge with the soles of the feet together and the knees out. Short range,
  high reps, pure glutes.
setup:
  - Lie on your back with the soles of the feet together and the knees dropped out,
    heels close to the hips.
steps:
  - Drive the hips up, pushing through the outer edges of the feet.
  - Squeeze the glutes at the top.
  - Lower a few inches and pump again. Do 20–30 reps.
cues:
  - Chin tucked, ribs down.
  - Fast up, controlled down.
mistakes:
  - Arching the back.
  - Letting the knees come together.
safety:
  - Keep the range small and the neck relaxed.
breathing: Breathe out on each pump.
regressions: [glute-bridge]
videos:
  youtube: https://www.youtube.com/watch?v=bJ2KSwJJCnY
tags: [bodyweight, glutes, home]
notes: >-
  Soles of the feet together, short bridges
