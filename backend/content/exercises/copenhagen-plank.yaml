slug: copenhagen-plank
name: Copenhagen Plank
status: draft
level: intermediate
category: strength
movement: core
mechanics: compound
laterality: unilateral
muscles:
  primary: [adductors, obliques]
  secondary: [abs, glutes]
equipment: [box]
summary: >-
  A side plank with the top leg resting on a bench. Trains the inner thighs and
  obliques together, which protects the groin.
setup:
  - Lie on one side with the top foot on a bench, forearm on the floor under the
    shoulder.
steps:
  - Lift the hips and the bottom leg until the body is straight, supported by the
    forearm and the top foot.
  - Hold for 10–30 seconds.
  - Lower and switch sides.
cues:
  - Squeeze the inner thigh of the top leg.
  - Hips in line with the body.
mistakes:
  - Letting the hips sag.
  - Rotating forward.
safety:
  - Start with the bent-knee version (knee on the bench).
breathing: Breathe steadily.
regressions: [side-plank]
videos:
  youtube: https://www.youtube.com/watch?v=YRRnnZsRs9U
tags: [adductors, core, hold, home]
notes: >-
  Top leg on a bench or chair. On both your core and legs lists
