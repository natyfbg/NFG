slug: isometric-towel-curl
name: Isometric Towel Curl
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [biceps]
  secondary: [forearms]
equipment: []
lists: [pull]
summary: >-
  Pulling up on a towel held under your foot as hard as you can for time. A
  no-equipment biceps hold for travel or home.
setup:
  - Stand on the middle of a towel and hold the ends with the elbows bent at 90 degrees.
steps:
  - Pull up on the towel as hard as you can without moving.
  - Hold for 10–20 seconds.
  - Rest and repeat at a different elbow angle.
cues:
  - Elbows at the sides.
  - Squeeze the biceps, not just the hands.
mistakes:
  - Holding your breath.
  - Shrugging.
safety:
  - Keep breathing throughout the hold.
breathing: Breathe steadily during the hold.
videos:
  youtube: https://www.youtube.com/watch?v=p8z4fhUWhP4
tags: [biceps, bodyweight, curl, hold, home]
notes: >-
  Towel under your foot, pull up and hold. The only no-equipment biceps move besides
  chin-ups
