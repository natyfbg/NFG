slug: bench-dip
name: Bench Dip
status: published
level: beginner
category: strength
movement: vertical_push
mechanics: compound
laterality: bilateral
muscles:
  primary: [triceps]
  secondary: [front_delts, chest]
equipment: [bench]
summary: >-
  Lowering and pressing your body from the edge of a bench using your arms. A simple
  triceps builder you can do almost anywhere.
setup:
  - Sit on the edge of a sturdy bench with your hands next to your hips, fingers
    forward.
  - Slide your hips off the bench and walk your feet out, knees bent.
  - Keep your back close to the bench.
steps:
  - Bend your elbows to lower your hips toward the floor.
  - Stop when your upper arms are about parallel to the floor.
  - Press through your palms to straighten your arms.
cues:
  - Elbows point straight back, not out.
  - Keep your hips close to the bench.
  - Straighten your legs to make it harder.
mistakes:
  - Lowering too deep, which strains the front of the shoulders.
  - Drifting away from the bench.
  - Shrugging the shoulders up toward the ears.
safety:
  - Skip this one if it causes pain at the front of the shoulder; use close-grip
    push-ups instead.
breathing: Breathe in as you lower, out as you press up.
videos:
  youtube: https://www.youtube.com/watch?v=WVeZDBhZwLA
tags: [push, triceps, bodyweight]
