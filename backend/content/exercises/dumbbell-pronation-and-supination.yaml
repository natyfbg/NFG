slug: dumbbell-pronation-and-supination
name: Dumbbell Pronation and Supination
status: published
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [forearms]
equipment: [dumbbell]
summary: >-
  Rotating a dumbbell held at one end, palm up to palm down, with the forearm
  supported. Builds the rotating muscles of the forearm and protects the elbow.
setup:
  - Sit with the forearm on your thigh or a bench, wrist past the edge, holding a light
    dumbbell by one end.
steps:
  - Rotate the palm up slowly.
  - Rotate it down slowly.
  - Continue for 10–15 reps per direction, then switch arms.
cues:
  - Forearm stays still; only the wrist rotates.
  - Slow tempo.
mistakes:
  - Using a heavy dumbbell.
  - Lifting the forearm.
safety:
  - Very light; the leverage makes it hard.
breathing: Breathe normally.
videos:
  youtube: https://www.youtube.com/watch?v=nZHS1gWMc6I
tags: [forearms, hybrid, unilateral]
notes: >-
  Hold one end of a light dumbbell and rotate. Good for wrist health
