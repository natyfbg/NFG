slug: cross-body-shoulder-stretch
name: Cross-Body Shoulder Stretch
status: published
level: beginner
category: mobility
movement: mobility
mechanics: isolation
laterality: bilateral
muscles:
  primary: [rear_delts]
  secondary: [upper_back]
equipment: []
summary: >-
  Pulling one straight arm across your chest with the other. Targets the back of the
  shoulder, which gets tight from pressing and from desk work.
setup:
  - Stand or sit tall. Bring one arm straight across your chest at shoulder height.
steps:
  - Hook the other forearm under it and pull the arm gently closer to your chest.
  - Keep the stretching shoulder down; feel it at the back of the shoulder.
  - Hold for 20–30 seconds, then switch.
cues:
  - Pull the arm, not the shoulder, across.
  - Keep looking straight ahead.
mistakes:
  - Shrugging the stretched shoulder up toward the ear.
  - Twisting the torso to get a bigger stretch.
safety:
  - Ease off if you feel pinching at the front of the shoulder.
breathing: Breathe normally, relaxing into it on each breath out.
videos:
  youtube: https://www.youtube.com/watch?v=q1QZ3h8HVtw
tags: [cool-down, home, mobility, shoulders, stretching]
