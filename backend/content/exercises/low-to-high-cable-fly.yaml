slug: low-to-high-cable-fly
name: Low-to-High Cable Fly
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [upper_chest]
  secondary: [front_delts]
equipment: [cable]
lists: [full_push, chest_focus, shoulder_focus]
summary: >-
  A cable fly with the pulleys set low, sweeping the hands up and together.
  Upper-chest focus with constant tension.
setup:
  - Set both pulleys low and hold the handles, palms facing forward. Step forward into a
    staggered stance.
  - Arms down and slightly out, elbows soft.
steps:
  - Sweep the hands up and together until they meet in front of your upper chest.
  - Squeeze at the top.
  - Lower slowly back to the start.
cues:
  - Think of scooping, not curling.
  - Keep the chest up and the shoulders down.
mistakes:
  - Swinging the torso to get the weight up.
  - Turning it into a front raise by keeping the arms straight down.
safety:
  - Keep the weight light; the shoulders are in a weak position at the bottom.
breathing: Breathe out as the hands rise.
videos:
