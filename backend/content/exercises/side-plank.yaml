slug: side-plank
name: Side Plank
status: published
level: beginner
category: strength
movement: core
mechanics: compound
laterality: unilateral
muscles:
  primary: [obliques]
  secondary: [abs, abductors]
equipment: []
summary: >-
  Holding your body in a straight line on one forearm and the side of your foot. It
  strengthens the sides of your core and the outer hip.
setup:
  - Lie on your side with your elbow under your shoulder and your forearm on the floor.
  - Stack your feet, or put the top foot in front for more balance.
steps:
  - Lift your hips so your body forms a straight line from head to feet.
  - Hold the position without letting your hips drop.
  - Lower your hips to the floor, then switch sides.
cues:
  - Push the floor away with your bottom forearm.
  - Drive your hips up toward the ceiling.
  - Keep your head in line with your spine.
mistakes:
  - Letting the hips sink toward the floor.
  - Rolling forward or backward instead of staying stacked.
  - Letting the shoulder shrug up toward the ear.
safety:
  - Bend your knees and rest on them to make it easier if your shoulder or hips can't
    hold the line.
breathing: Breathe steadily throughout the hold.
