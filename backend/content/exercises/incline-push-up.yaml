slug: incline-push-up
name: Incline Push-Up
status: published
level: beginner
category: strength
movement: horizontal_push
mechanics: compound
laterality: bilateral
muscles:
  primary: [chest]
  secondary: [triceps, front_delts, abs]
equipment: []
summary: >-
  A push-up with your hands raised on a bench, counter or step. The higher the
  surface, the easier it gets, so it's the best way to build up to full push-ups.
setup:
  - Place your hands on a sturdy raised surface, slightly wider than shoulder-width.
  - Walk your feet back until your body forms a straight line from head to heels.
steps:
  - Brace your core and squeeze your glutes.
  - Bend your elbows to lower your chest toward the edge of the surface.
  - Stop when your chest is about a fist's width away.
  - Press the surface away to straighten your arms, keeping your body in one line.
cues:
  - Elbows about 45° from your body, not flared out to the sides.
  - Move as one plank; hips rise and lower with your shoulders.
  - Lower the surface over time as you get stronger.
mistakes:
  - Letting the hips sag toward the floor.
  - Only bending the elbows halfway.
  - Craning the neck forward to reach the surface.
safety:
  - Use a surface that can't slide or tip, like a wall-backed bench or kitchen counter.
breathing: Breathe in as you lower, out as you press away.
progressions: [push-up]
tags: [push, chest, bodyweight, beginner-friendly]
