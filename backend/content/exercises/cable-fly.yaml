slug: cable-fly
name: Cable Fly
status: draft
level: beginner
category: strength
movement: isolation
mechanics: isolation
laterality: bilateral
muscles:
  primary: [chest]
  secondary: [front_delts]
equipment: [cable]
summary: >-
  A standing chest isolation exercise. Bringing the cable handles together in a wide
  hugging arc trains the chest without much help from the triceps.
setup:
  - Set both pulleys at about shoulder height and grab a handle in each hand.
  - Step forward into a split stance until there's tension on the cables.
  - Keep a slight bend in your elbows and lean your chest slightly forward.
steps:
  - Start with your arms out wide and a stretch across your chest.
  - Sweep your hands forward and together in a wide arc, as if hugging a tree.
  - Squeeze your chest when your hands meet in front of you.
  - Return slowly along the same arc until you feel the stretch again.
cues:
  - Keep the elbow bend the same from start to finish.
  - Move at the shoulders, not the elbows.
  - Stay tall; don't let the cables pull your shoulders forward.
mistakes:
  - Turning it into a press by bending and straightening the elbows.
  - Going too heavy and losing the stretch at the start.
  - Shrugging the shoulders up toward the ears.
safety:
  - Don't let the cables pull your arms back past a comfortable stretch.
breathing: Breathe out as your hands come together, in as they open.
tags: [chest, cable, isolation]
