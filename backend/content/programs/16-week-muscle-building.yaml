# 16-week Muscle Building (Nate, 2026-11-16): five days, Push / Pull / Legs / Upper /
# Lower, more intense than the challenge programs, eaten in a small surplus (bulk).
slug: 16-week-muscle-building
title: 16-Week Muscle Building
accent: "#C8402F"
order: 3
status: draft  # Nate reviews as admin on the live site, then this becomes published
goal: Build muscle (bulk)
summary: >-
  Five days a week, Push, Pull, Legs, Upper and Lower, with more volume and heavier
  weights every month. Eat in a small surplus and grow.
weeks: 16
session_minutes: 60
rules:
  - "Train 5 days a week: Push, Pull, Legs, rest, Upper, Lower, rest."
  - "Eat in a small surplus: about 250–500 kcal over maintenance. Aim to gain 0.25–0.5% of your body weight a week."
  - "Protein every day: 1.8–2.2 g per kg of body weight. Most of your carbs around training."
  - "Add a rep or a little weight every week while your form stays clean."
  - "Most sets stop 1–2 reps short of failure; the last set of an isolation exercise can go all the way."
  - "Sleep 7–9 hours. Week 16 is lighter on purpose: recover, then start again heavier."

phases:
  - name: Accumulation
    weeks: [1, 2, 3, 4]
    note: Higher reps to build work capacity and groove every lift.
    main: {sets: 4, reps: "10–12", rest: 90s}
    accessory: {sets: 3, reps: "12–15", rest: 60s}
  - name: Hypertrophy
    weeks: [5, 6, 7, 8]
    note: The muscle-building sweet spot. Push every set close to failure.
    main: {sets: 4, reps: "8–10", rest: 2 min}
    accessory: {sets: 3, reps: "10–12", rest: 60s}
  - name: Strength
    weeks: [9, 10, 11, 12]
    note: Heavier main lifts with one more set. The extra strength drives more growth later.
    main: {sets: 5, reps: "6–8", rest: 2 min 30s}
    accessory: {sets: 3, reps: "10–12", rest: 75s}
  - name: Overload
    weeks: [13, 14, 15]
    note: The hardest block. Eat and sleep well; this is where you grow.
    main: {sets: 5, reps: "5–6", rest: 3 min}
    accessory: {sets: 4, reps: "8–10", rest: 75s}
  - name: Deload
    weeks: [16]
    note: Lighter week to recover before you run it again with heavier weights.
    main: {sets: 3, reps: "8", rest: 2 min}
    accessory: {sets: 2, reps: "12", rest: 60s}

