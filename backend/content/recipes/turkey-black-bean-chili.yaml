slug: turkey-black-bean-chili
name: Turkey Black Bean Chili
meal: lunch
minutes: 45
servings: 6
tags: [meal-prep]
summary: A big pot of lean turkey chili with black beans and peppers. Six portions that freeze well.
ingredients:
- {amount: 900, unit: g, item: lean ground turkey (93%), food: ground-turkey}
- {amount: 480, unit: g, item: 'black beans, drained and rinsed', food: black-beans, note: 2 cans}
- {amount: 800, unit: g, item: crushed tomatoes, food: crushed-tomatoes, note: 2 cans}
- {amount: 1, item: 'large onion, diced|large onions, diced', food: onion, grams: 200}
- {amount: 2, item: 'bell pepper, diced|bell peppers, diced', food: bell-pepper, grams: 300}
- {amount: 3, item: 'garlic clove, minced|garlic cloves, minced', food: garlic, grams: 9}
- {amount: 1, unit: tbsp, item: olive oil, food: olive-oil, grams: 14}
- {amount: 2, unit: tbsp, item: chili powder}
- {amount: 2, unit: tsp, item: ground cumin}
- {amount: 1, unit: tsp, item: smoked paprika}
- {amount: 250, unit: ml, item: water or stock}
- {item: salt}
steps:
- Heat the oil in a large pot over medium. Cook the onion and peppers for 5 minutes.
- Add the garlic and spices and stir for 1 minute.
- Add the turkey, break it up and brown for 6–8 minutes.
- Stir in the tomatoes, beans and water. Simmer uncovered for 25 minutes, stirring now and then, until thick. Season
  with salt.
- Portion into 6 containers.
tip: Keeps 4 days in the fridge or 3 months in the freezer.
