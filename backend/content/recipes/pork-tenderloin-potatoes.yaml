slug: pork-tenderloin-potatoes
name: Rosemary Pork Tenderloin & Potatoes
meal: dinner
minutes: 40
servings: 3
summary: Lean pork tenderloin with crispy rosemary potatoes and green beans. A Sunday dinner that's on your plan.
ingredients:
- {amount: 600, unit: g, item: pork tenderloin, food: pork-tenderloin}
- {amount: 600, unit: g, item: 'baby potatoes, halved', food: potato}
- {amount: 300, unit: g, item: 'green beans, trimmed', food: green-beans}
- {amount: 1.5, unit: tbsp, item: olive oil, food: olive-oil, grams: 20}
- {amount: 2, item: 'garlic clove, minced|garlic cloves, minced', food: garlic, grams: 6}
- {amount: 1, unit: tsp, item: Dijon mustard}
- {amount: 1, unit: tsp, item: dried rosemary}
- {item: salt and pepper}
steps:
- Heat the oven to 220°C / 425°F. Toss the potatoes with half the oil, the rosemary and salt. Roast 15 minutes.
- Rub the pork with the mustard, garlic, the rest of the oil, salt and pepper.
- Add the pork and green beans to the tray and roast 18–22 minutes, until the pork reaches 63°C / 145°F inside.
- Rest the pork 5 minutes, then slice.
