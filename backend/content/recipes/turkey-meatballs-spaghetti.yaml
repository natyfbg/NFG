slug: turkey-meatballs-spaghetti
name: Turkey Meatballs & Spaghetti
meal: dinner
minutes: 40
servings: 4
summary: Baked turkey and parmesan meatballs in a quick tomato sauce, over spaghetti.
ingredients:
- {amount: 600, unit: g, item: lean ground turkey (93%), food: ground-turkey}
- {amount: 1, item: large egg|large eggs, food: egg, grams: 50}
- {amount: 30, unit: g, item: 'parmesan, grated', food: parmesan}
- {amount: 30, unit: g, item: rolled oats, food: oats}
- {amount: 2, item: 'garlic clove, minced|garlic cloves, minced', food: garlic, grams: 6}
- {amount: 1, unit: tsp, item: Italian seasoning}
- {amount: 800, unit: g, item: crushed tomatoes, food: crushed-tomatoes, note: 2 cans}
- {amount: 2, unit: tsp, item: olive oil, food: olive-oil, grams: 10}
- {amount: 280, unit: g, item: spaghetti (dry), food: pasta}
- {item: 'salt, pepper and fresh basil'}
steps:
- Heat the oven to 200°C / 400°F and line a tray.
- Mix the turkey, egg, parmesan, oats, half the garlic, the Italian seasoning and a pinch of salt. Roll into 16
  balls and bake 15–18 minutes.
- Meanwhile warm the oil in a saucepan, cook the rest of the garlic for 30 seconds, add the tomatoes and simmer
  10 minutes. Add the meatballs and simmer 5 minutes more.
- Cook the spaghetti, drain and serve with the meatballs and sauce, torn basil on top.
