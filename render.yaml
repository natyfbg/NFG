# render.yaml
# Defines infrastructure and services for deploying Qiltsim (service names keep "nfg") on Render

services:
  # === 1) Web Service (Flask + Gunicorn) ===
  - type: web
    name: nfg-app
    env: docker
    plan: starter
    region: oregon
    autoDeploy: true
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    startCommand: /bin/sh /app/starter.sh
    envVars:
      - key: MONGO_URI
        sync: false   # MongoDB Atlas connection string; set in Render dashboard
      - key: MONGO_DB
        value: NFG
      - key: SECRET_KEY
        sync: false   # set in Render dashboard
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false   # set in Render dashboard
      - key: ADMIN_EMAILS
        sync: false   # emails of existing accounts that also get admin (comma-separated)
      - key: UPLOAD_FOLDER
        value: /app/static/uploads
      - key: CANONICAL_HOST
        sync: false   # qiltsim.com, only after the custom domain is verified (turns on redirects)
      - key: RESEND_API_KEY
        sync: false   # Resend sending key; password reset is hidden until it is set
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: uploads
      mountPath: /app/static/uploads
      sizeGB: 2

  # === 2) One-off seed job (manual trigger) ===
  - type: job
    name: nfg-seed
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    startCommand: python seed.py
    autoDeploy: false         # run manually after first deploy
    envVars:
      - key: MONGO_URI
        sync: false   # MongoDB Atlas connection string; set in Render dashboard
      - key: MONGO_DB
        value: NFG
