[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "/(static|templates|migrations|node_modules)/"

[tool.isort]
profile = "black"
line_length = 100
skip = ["static", "templates", "node_modules", "migrations"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    # app.py uses naive utcnow() throughout; Python 3.12+ flags it.
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]
